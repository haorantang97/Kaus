    ? `<span class="sb inh">继承自 ${esc(s.source || "?")}</span>`
    : `<span class="sb own">自带</span>`;
  const ownN = data.skills.filter(s => !s.inherited).length;
  box.innerHTML = `
    <div class="askadd">
      <input id="ask-install" placeholder="装技能：owner/skills/name 或 SKILL.md URL" />
      <span class="btn" id="ask-install-go">安装</span>
    </div>
    <div class="askadd">
      <input id="ask-uninstall" placeholder="卸载：技能名（内置的卸不掉）" />
      <span class="btn" id="ask-uninstall-go">卸载</span>
    </div>
    <div class="askadd">
      ${data.converted
        ? `<span class="dstat on">已精简（和上级重复的技能改为共享）</span><span class="btn" id="ask-revert">还原</span>`
        : `<span class="btn" id="ask-convert">精简重复技能</span><span class="out">把和上级重复的技能改为共享，省空间，可还原</span>`}
    </div>
    <div class="note" style="margin:8px 0">技能会在需要时自动触发。「继承自 X」= 从上级 X 自动获得（X 增删，这里跟着变）；单独借来的可随时解除。</div>
    ` + data.skills.map(s => `<div class="askrow">
      <span class="an" title="${esc(s.desc || "")}">${esc(s.name)}</span>${badge(s)}
      ${s.via === "symlink" ? `<span class="aun" data-unshare="${esc(s.category)}" title="收回借用（不删原技能）">解除</span>` : ""}
    </div>`).join("");
  const cv = document.getElementById("ask-convert");
  if (cv) cv.onclick = async () => {
    try {
      const p = await getJSON(`/api/skills/convert-inherit/${encodeURIComponent(name)}`);  // dry-run 预览
      if (p.error) { toast(p.error); return; }
      const from = (p.ancestors_inherited_from || []).join(", ") || "（无祖先）";
      if (!await confirmAsync(`精简「${name}」的重复技能？\n· 把 ${p.redundant.length} 个和上级完全一样的技能改为共享（原文件存进备份，可还原）\n· 保留你定制过的 ${p.kept_customized.length} 个、独有的 ${p.kept_unique.length} 个\n· 之后从上级（${from}）自动获得这些技能\n随时可「还原」。`)) return;
      const r = await fetch(`/api/skills/convert-inherit/${encodeURIComponent(name)}`, { method: "POST" });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      renderAgentSkills(name); load();
    } catch (e) { toast("精简失败：" + e.message, "bad"); }
  };
  const rv = document.getElementById("ask-revert");
  if (rv) rv.onclick = async () => {
    if (!await confirmAsync(`还原「${name}」的技能？把备份里的原技能搬回来，恢复成精简前的样子。`)) return;
    try {
      const r = await fetch(`/api/skills/revert-inherit/${encodeURIComponent(name)}`, { method: "POST" });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      renderAgentSkills(name); load();
    } catch (e) { toast("撤销失败：" + e.message, "bad"); }
  };
  document.getElementById("ask-install-go").onclick = async () => {
    const ident = document.getElementById("ask-install").value.trim();
    if (!ident) return;
    if (!await confirmAsync(`给 ${name} 安装「${ident}」？\n会联网拉取并做安全扫描。`)) return;
    try {
      const r = await fetch(`/api/agent-skills/${encodeURIComponent(name)}/install`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ identifier: ident }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      renderAgentSkills(name);
    } catch (e) { toast("安装失败：" + e.message, "bad"); }
  };
  document.getElementById("ask-uninstall-go").onclick = async () => {
    const sk = document.getElementById("ask-uninstall").value.trim();
    if (!sk) return;
    if (!await confirmAsync(`从 ${name} 卸载「${sk}」？不可恢复（内置技能卸不掉）。`)) return;
    try {
      const r = await fetch(`/api/agent-skills/${encodeURIComponent(name)}/uninstall`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ skill: sk }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      renderAgentSkills(name);
    } catch (e) { toast("卸载失败：" + e.message, "bad"); }
  };
  box.querySelectorAll("[data-unshare]").forEach(el => el.addEventListener("click", async () => {
    if (!await confirmAsync("解除借用「" + el.dataset.unshare + "」？只收回这个 AI 的借用，不影响原技能。")) return;
    try {
      const r = await fetch("/api/link", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target: name, skill: el.dataset.unshare }) });
      if (!r.ok) { const j = await r.json(); throw new Error(j.detail || ("HTTP " + r.status)); }
      renderAgentSkills(name);
    } catch (e) { toast("解除失败：" + e.message, "bad"); }
  }));
}
function sessionsHTML(d) {
  if (d.sessions_note) return `<p class="note">${esc(d.sessions_note)}</p>`;
  if (!d.sessions.length) return '<p class="note">暂无会话</p>';
  return d.sessions.map(s => {
    if (s.raw) return `<div class="sess"><div class="t">${esc(s.raw)}</div></div>`;
    const head = s.title || s.preview || "(无标题)";
    const tail = [s.last_active, s.src, s.id].filter(Boolean).join("  ·  ");
    return `<div class="sess"><div class="t">${esc(head)}</div>${tail ? `<div class="m2">${esc(tail)}</div>` : ""}</div>`;
  }).join("");
}

/* ===== 关系网络（组织树：拖动改父级 + 共享/解除共享） ===== */
let TREE = null, dragNode = null;
function openNetwork() { document.getElementById("netwrap").classList.add("on"); loadTree(); }
function closeNetwork() { document.getElementById("netwrap").classList.remove("on"); }
async function loadTree() {
  const wrap = document.getElementById("netwrap");
  wrap.innerHTML = `<div class="net-head"><span class="ttl">Agent 关系网络</span><span class="sp"></span>
      <span class="rl" id="net-reload">刷新</span>
      <span class="rl" id="net-close" style="margin-left:16px">关闭</span></div>
    <div class="net-body" id="net-body"><div class="note">加载中…</div></div>`;
  document.getElementById("net-close").onclick = closeNetwork;
  document.getElementById("net-reload").onclick = loadTree;
  try { TREE = await getJSON("/api/network"); }
  catch (e) { document.getElementById("net-body").innerHTML = `<div class="note">加载失败：${esc(e.message)}</div>`; return; }
  Object.values(TREE.nodes || {}).forEach(n => { if (n.label) LABELS[n.name] = n.label; });
  (TREE.drafts || []).forEach(n => { if (n.label) LABELS[n.name] = n.label; });
  renderTree();
}
function renderTree() {
  const body = document.getElementById("net-body"), nodes = TREE.nodes;
  // 自上而下 org chart：嵌套 <ul><li>，父在上、子横排在下，伪元素画连线
  const liHTML = (name) => {
    const n = nodes[name]; if (!n) return "";
    const sl = (n.symlinks || []).filter(s => s.target_profile);
    const tags = [];
    if (n.main_twin) tags.push('<span class="on-tag twin">分身</span>');
    if (n.killed || n.effective_killed) tags.push('<span class="on-tag bad">停用</span>');
    const roleLabel = name === "default" ? "主 agent" : (ROLE_FULL[n.role] || "独立");
    const meta = `${roleLabel} · ${n.skill_count} 技能${sl.length ? " · 🔗" + sl.length : ""}${n.config_inherit ? " · ⟳cfg" : ""}`;
    // 子节点排序与侧栏一致：分身（main_twin）置顶成组，其余按字母
    const sortedKids = (n.children || []).slice().sort((x, y) => {
      const tx = (nodes[x] && nodes[x].main_twin) ? 0 : 1, ty = (nodes[y] && nodes[y].main_twin) ? 0 : 1;
      return (tx - ty) || x.localeCompare(y);
    });
    const kids = sortedKids.map(liHTML).join("");
    return `<li>
      <div class="onode ${name === "default" ? "root" : ""}" draggable="true" data-name="${esc(name)}">
        <div class="on-top"><span class="on-nm" title="${esc(name)}">${esc(dname(name))}</span>${tags.join("")}</div>
        <div class="on-meta">${esc(meta)}</div>
        <div class="on-acts">
          <span class="act" data-cfg="${esc(name)}">配置</span>
          <span class="act" data-share="${esc(name)}">共享</span>
          ${sl.length ? `<span class="act" data-manage="${esc(name)}">解除</span>` : ""}
        </div>
      </div>
      ${kids ? `<ul>${kids}</ul>` : ""}
    </li>`;
  };
  const drafts = TREE.drafts || [];
  const draftHTML = (d) => `<div class="onode draft" draggable="true" data-name="${esc(d.name)}">
      <div class="on-top"><span class="on-nm" title="${esc(d.name)}">${esc(dname(d.name))}</span><span class="on-tag warn">草稿</span></div>
      <div class="on-meta">尚未落位</div>
    </div>`;
  const draftsBlock = drafts.length
    ? `<div class="net-hint" style="color:var(--muted)">草稿（${drafts.length}）：拖到下面树里某个 agent 上，才正式入树。</div>
       <div class="drafts-tnodes" style="display:flex; flex-wrap:wrap; gap:8px; padding:8px 0 14px; border-bottom:1px dashed var(--hair); margin-bottom:14px">
         ${drafts.map(draftHTML).join("")}
       </div>`
    : "";
  body.innerHTML = `<div class="net-hint">自上而下的组织层级：上是上级、下是下属。把一个 AI 拖到另一个上面 = 让它（连同手下）改到对方手下；悬停节点出现「配置 / 共享」。只调组织关系，不动对话和数据，随时改回。</div>
    ${draftsBlock}
    <div class="droptop" id="droptop">拖到这里 = 设为顶层（脱离父级）</div>
    <div class="org"><ul>${TREE.roots.map(liHTML).join("")}</ul></div>`;
  body.querySelectorAll(".onode").forEach(el => {
    el.addEventListener("dragstart", e => { dragNode = el.dataset.name; el.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => { el.classList.remove("drag"); body.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); });
    el.addEventListener("dragover", e => { e.preventDefault(); if (dragNode && dragNode !== el.dataset.name) el.classList.add("drop"); });
    el.addEventListener("dragleave", () => el.classList.remove("drop"));
    el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("drop"); const t = el.dataset.name; if (dragNode && dragNode !== t) reparentDialog(dragNode, t); });
  });
  body.querySelectorAll("[data-cfg]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); configDialog(el.dataset.cfg); }));
  body.querySelectorAll("[data-share]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); shareDialog(el.dataset.share); }));
  body.querySelectorAll("[data-manage]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); manageDialog(el.dataset.manage); }));
  const dt = document.getElementById("droptop");
  dt.addEventListener("dragover", e => { e.preventDefault(); if (dragNode) dt.classList.add("drop"); });
  dt.addEventListener("dragleave", () => dt.classList.remove("drop"));
  dt.addEventListener("drop", e => { e.preventDefault(); dt.classList.remove("drop"); if (dragNode) reparentDialog(dragNode, null); });
}
function modal(html) { const s = document.getElementById("modal-scrim"); s.innerHTML = `<div class="modal">${html}</div>`; s.classList.add("on"); return s.querySelector(".modal"); }
function closeModal() { const s = document.getElementById("modal-scrim"); s.classList.remove("on"); s.innerHTML = ""; }

/* C1: 自定义 toast + 异步 confirm，统一替代原生 toast()/await confirmAsync()，避免 Chrome MCP 卡死 + UX 一致
   toast(msg, type='') —— 短期提示（默认 3.5s 自动消失），type ∈ '' | 'ok' | 'warn' | 'bad'
   confirmAsync(msg, opts) —— 返回 Promise<boolean>，true=确认 false=取消 */
function toast(msg, type = "", duration = 3500) {
  const stack = document.getElementById("toast-stack");
  if (!stack) return;
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .25s"; setTimeout(() => t.remove(), 280); }, duration);
}
function confirmAsync(msg, opts = {}) {
  return new Promise(resolve => {
    const okLabel = esc(opts.ok || "确认");
    const cancelLabel = esc(opts.cancel || "取消");
    const danger = opts.danger ? "primary" : "primary";  // 视觉上未来可分级
    const m = modal(`<h3>${esc(opts.title || "确认操作")}</h3>
      <div class="sub" style="white-space:pre-wrap; line-height:1.55">${esc(msg)}</div>
      <div class="row">
        <span class="btn" id="cf-cancel">${cancelLabel}</span>
        <span class="btn ${danger}" id="cf-ok">${okLabel}</span>
      </div>`);
    const done = (v) => { closeModal(); resolve(v); };
    document.getElementById("cf-cancel").onclick = () => done(false);
    document.getElementById("cf-ok").onclick = () => done(true);
    setTimeout(() => document.getElementById("cf-ok").focus(), 50);
  });
}
async function refreshAll() { await loadTree(); load(); }

function reparentDialog(node, np) {
  // tab 化的落位预演对话框：先调 /api/reparent-preview 拿完整 profile diff，再分 tab 展示
  // 用户取消则什么都没发生；确认 → /api/move + 可选 /api/constitution/apply + 立即物化 config
  // 草稿（顶栏「+」新建未落位）不在 TREE.nodes 里，要从 TREE.drafts 里找。
  const n = TREE.nodes[node] || (TREE.drafts || []).find(d => d.name === node) || { symlinks: [], parent: null };
  const sl = (n.symlinks || []).filter(s => s.target_profile), cur = n.parent;
  const title = np ? `把 <span class="self">${esc(node)}</span> 移到 <span class="self">${esc(np)}</span> 下`
                   : `把 <span class="self">${esc(node)}</span> 设为顶层`;
  const dropHTML = sl.length
    ? sl.map(s => `<label class="ck"><input type="checkbox" class="dropck" value="${esc(s.name)}" ${s.target_profile === cur ? "checked" : ""}> 丢弃 ${esc(s.name)}（来自 ${esc(s.target_profile)}）</label>`).join("")
    : `<div class="empty">无可丢弃的共享技能</div>`;
  const m = modal(`<h3>${title}</h3>
    <div class="sub">${esc(node)} 手下的所有 AI 会一起跟着走；调整随时可改回。</div>
    <div class="tabs">
      <span class="tab on" data-pane="pos">位置</span>
      <span class="tab" data-pane="sk">技能<span class="pill" id="pill-sk">·</span></span>
      <span class="tab" data-pane="cfg">配置<span class="pill" id="pill-cfg">·</span></span>
      <span class="tab" data-pane="con">宪法<span class="pill" id="pill-con">·</span></span>
    </div>
    <div class="tabpane on" data-pane="pos" id="pane-pos"><div class="empty">加载中…</div></div>
    <div class="tabpane" data-pane="sk" id="pane-sk">
      <div class="grp" id="extgrp"><h4>继承上级的技能</h4><div class="empty">加载中…</div></div>
      <div class="grp"><h4>丢掉从旧上级借来的技能</h4>${dropHTML}</div>
      <div class="grp" id="addgrp"><h4>从新父辈引入</h4><div class="empty">${np ? "加载中…" : "顶层：不引入"}</div></div>
    </div>
    <div class="tabpane" data-pane="cfg" id="pane-cfg"><div class="empty">加载中…</div></div>
    <div class="tabpane" data-pane="con" id="pane-con"><div class="empty">加载中…</div></div>
    <div class="warn" id="mwarn"></div>
    <div class="row"><span class="btn" id="mcancel">取消</span><span class="btn primary" id="mok" disabled>确认</span></div>`);
  document.getElementById("mcancel").onclick = closeModal;
  // tab 切换
  m.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    m.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    m.querySelectorAll(".tabpane").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    m.querySelector(`.tabpane[data-pane="${t.dataset.pane}"]`).classList.add("on");
  });
  if (np) fillAddCandidates(np, node);
  // 拉预演 diff
  let preview = null;
  fetch("/api/reparent-preview", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ node, new_parent: np }) })
    .then(r => r.json().then(j => ({ ok: r.ok, j })))
    .then(({ ok, j }) => {
      if (!ok) { document.getElementById("mwarn").textContent = "预演失败：" + (j.detail || "未知错误"); return; }
      preview = j;
      renderReparentPanes(m, preview);
      document.getElementById("mok").removeAttribute("disabled");
    })
    .catch(e => { document.getElementById("mwarn").textContent = "预演失败：" + e.message; });
  document.getElementById("mok").onclick = async () => {
    if (!preview) return;
    const drop = Array.from(m.querySelectorAll(".dropck:checked")).map(i => i.value);
    const add = Array.from(m.querySelectorAll(".addck:checked")).map(i => ({ source: np, skill: i.value }));
    // 配置 tab 取消勾选的继承键 → block
    const skip_inherit_keys = Array.from(m.querySelectorAll(".cfgck"))
      .filter(i => !i.checked).map(i => i.value);
    // 技能 tab 的总开关：勾=启用继承(off=false)，取消=关闭(off=true)；只在与当前不同时才传
    const skinhck = document.getElementById("skinhck");
    let skill_inherit_off_change = null;
    if (skinhck && !skinhck.disabled) {
      const wantOn = skinhck.checked;
      if (wantOn !== preview.skill_diff.skill_inherit_on) {
        skill_inherit_off_change = !wantOn;  // off = !on
      }
    }
    // 宪法订阅
    const constCk = document.getElementById("conck");
    const wantConst = constCk ? constCk.checked : preview.constitution.subscribed;
    const constChanged = wantConst !== preview.constitution.subscribed;
    document.getElementById("mok").setAttribute("disabled", "1");
    try {
      const r = await fetch("/api/move", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ node, new_parent: np, drop, add, skip_inherit_keys, skill_inherit_off_change }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      const warnings = [].concat(j.warnings || []);
      if (constChanged) {
        try {
          const cr = await fetch("/api/constitution/apply", { method: "POST", headers: { "Content-Type": "application/json" },
                                                              body: JSON.stringify({ name: node, on: wantConst }) });
          if (!cr.ok) { const cj = await cr.json(); warnings.push("宪法订阅调整失败：" + (cj.detail || cr.status)); }
        } catch (e) { warnings.push("宪法订阅调整失败：" + e.message); }
      }
      closeModal(); await refreshAll();
      if (warnings.length) toast("完成，但有提示：\n• " + warnings.join("\n• "));
    } catch (e) {
      document.getElementById("mwarn").textContent = "失败：" + e.message;
      document.getElementById("mok").removeAttribute("disabled");
    }
  };
}

function renderReparentPanes(m, p) {
  // 位置 tab
  const chainStr = (parent, anc) => {
    if (!parent && !anc.length) return `<span class="self">${esc(p.node)}</span><span class="arr">→</span><span style="color:var(--faint)">顶层（独立）</span>`;
    return `<span class="self">${esc(p.node)}</span>` + (anc.length ? anc.map(a => `<span class="arr">→</span>${esc(a)}`).join("") : "");
  };
  const warnHTML = (p.warnings || []).map(w => `<div class="note-strong">⚠ ${esc(w)}</div>`).join("");
  document.getElementById("pane-pos").innerHTML = `
    <div class="grp"><h4>来源</h4><div class="chain">${chainStr(p.from.parent, p.from.ancestors)}</div></div>
    <div class="grp"><h4>落位</h4><div class="chain">${chainStr(p.to.parent, p.to.ancestors)}</div></div>
    ${warnHTML}`;
  // 技能 tab — external_dirs diff + 总开关
  const sk = p.skill_diff;
  let extHTML = "";
  // 总开关：勾上 = 启用 skill 自动继承（external_dirs），取消 = 关闭并写进 skill_inherit_off
  const togDisabled = !sk.converted;          // 没转继承 → 没法启用，置灰
  const togChecked = sk.skill_inherit_on;     // 默认按当前状态
  extHTML += `<label class="ck"><input type="checkbox" id="skinhck" ${togChecked ? "checked" : ""} ${togDisabled ? "disabled" : ""}>
    自动继承上级的技能${togDisabled ? " — 需先在「技能」里精简过才能开" : ""}</label>`;
  if (sk.converted && sk.skill_inherit_on) {
    if (sk.ext_dirs_add.length || sk.ext_dirs_remove.length) {
      extHTML += `<div class="sub" style="margin-top:6px">落位后继承来源会变：` +
        (sk.ext_dirs_add.length ? `<span class="tag add">新增 ${sk.ext_dirs_add.length}</span> ` : "") +
        (sk.ext_dirs_remove.length ? `<span class="tag remove">移除 ${sk.ext_dirs_remove.length}</span>` : "") + `</div>`;
    } else {
      extHTML += `<div class="sub" style="margin-top:6px">继承来源不变。</div>`;
    }
  } else if (!sk.converted) {
    extHTML += `<div class="sub" style="margin-top:6px">这个 AI 还没精简过技能，暂时不走自动继承（它本地已有全套技能）。</div>`;
  }
  document.getElementById("extgrp").innerHTML = `<h4>继承上级的技能</h4>${extHTML}`;
  document.getElementById("pill-sk").textContent = (sk.ext_dirs_add.length + sk.ext_dirs_remove.length) || "·";
  // 配置 tab — 每条 diff 前面加复选框（默认勾，取消勾 = block 这次继承）
  const items = p.config_diff.items;
  let cfgHTML = "";
  if (p.is_main_twin) {
    cfgHTML = `<div class="empty">化身和主 AI 共用同一套设置，落位不影响它——它永远跟随主 AI。</div>`;
  } else if (p.node === "default") {
    cfgHTML = `<div class="empty">主 AI 是最顶层，没有上级可继承。</div>`;
  } else if (!items.length) {
    cfgHTML = `<div class="empty">设置没变化（新旧上级给到的设置一样）。</div>`;
  } else {
    cfgHTML = items.map(it => {
      let label, hint;
      if (it.change === "add") {
        label = `<span class="tag add">+</span><span class="k">${esc(it.key)}</span><span class="v">${esc(it.after)}</span>`;
        hint = `取消 = 不跟随这项`;
      } else if (it.change === "remove") {
        label = `<span class="tag remove">−</span><span class="k">${esc(it.key)}</span><span class="v">${esc(it.before)} → ×</span>`;
        hint = `取消 = 保留当前值不变`;
      } else {
        label = `<span class="tag update">~</span><span class="k">${esc(it.key)}</span><span class="v">${esc(it.before)} → ${esc(it.after)}</span>`;
        hint = `取消 = 保留旧值不变`;
      }
      return `<label class="ck" title="${hint}">
        <input type="checkbox" class="cfgck" value="${esc(it.key)}" checked>
        <span style="flex:1; font: 12px var(--mono); display:flex; gap:8px; align-items:baseline">${label}</span>
      </label>`;
    }).join("");
  }
  const ownHTML = p.config_diff.own_keys_unchanged.length
    ? `<div class="note-strong">你自己改过的设置不动，落位后还是这些：${p.config_diff.own_keys_unchanged.map(esc).join("、")}</div>`
    : "";
  document.getElementById("pane-cfg").innerHTML = `
    <div class="grp"><h4>从上级继承的设置（勾上 = 跟随 / 取消 = 不跟随）</h4>${cfgHTML}</div>
    ${ownHTML}
    <div class="sub" style="margin-top:10px">取消跟随的设置以后也不会自动同步。可继承的设置有：${p.config_diff.inheritable_keys.map(esc).join("、")}。</div>`;
  document.getElementById("pill-cfg").textContent = items.length || "·";
  // 宪法 tab
  const sub = p.constitution.subscribed;
  document.getElementById("pane-con").innerHTML = `
    <div class="grp"><h4>当前订阅状态</h4>
      <label class="ck"><input type="checkbox" id="conck" ${sub ? "checked" : ""}> 落位后订阅宪法（注入 SOUL.md 受管块）</label>
      <div class="sub" style="margin-top:6px">${sub ? "当前已订阅。" : "当前未订阅。"}宪法和组织树解耦，可任意单独调整；这里只是顺便确认。</div>
    </div>`;
  document.getElementById("pill-con").textContent = sub ? "✓" : "·";
}
async function fillAddCandidates(parent, node) {
  try {
    const [pa, na] = await Promise.all([getJSON(`/api/skills/${encodeURIComponent(parent)}`), getJSON(`/api/skills/${encodeURIComponent(node)}`)]);
    const have = new Set(na.skills.map(s => s.name));
    const cand = pa.skills.filter(s => !have.has(s.name));
    const items = cand.map(s => `<label class="ck"><input type="checkbox" class="addck" value="${esc(s.name)}"> 引入 ${esc(s.name)}</label>`).join("");
    document.getElementById("addgrp").innerHTML = `<h4>从 ${esc(parent)} 引入（${esc(node)} 还没有的）</h4>${items || '<div class="note">没有新技能可引入</div>'}`;
  } catch (e) { document.getElementById("addgrp").innerHTML = `<h4>引入</h4><div class="note">加载失败：${esc(e.message)}</div>`; }
}
function shareDialog(node) {
  const others = Object.keys(TREE.nodes).filter(x => x !== node).sort();
  modal(`<h3>给 ${esc(node)} 共享技能</h3>
    <div class="sub">把某个 AI 的技能借给 ${esc(node)} 用（不影响原 AI，随时可解除）。</div>
    <div class="grp"><h4>来源 Agent</h4>
      <select id="shsrc"><option value="">— 选择 —</option>${others.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select></div>

/* ===== config 继承（快照合并；目录类继承走「共享…」=实时 symlink） ===== */
async function configDialog(node) {
  let me, imap = {};
  try { me = await getJSON(`/api/config/${encodeURIComponent(node)}`); } catch (e) { me = { has_backup: false }; }
  try { imap = (await getJSON("/api/config-inherit")).map || {}; } catch (e) {}
  const live = imap[node];   // {parent, keys} | undefined
  const others = Object.keys(TREE.nodes).filter(x => x !== node).sort();
  modal(`<h3>让 ${esc(node)} 继承设置</h3>
    <div class="sub">从某个 AI 继承设置（模型 / MCP / 工具…）。
      <b>实时同步</b>=上级一改、它几秒内自动跟随（你自己改过的保留，其余听上级的）；不勾=只复制当前这一次。
      ⚠ 正在进行的对话需要重开才生效。</div>
    ${live ? `<div class="grp"><div class="note">● 正在【实时继承】自 <b>${esc(live.parent)}</b>：${esc((live.keys || []).join(", "))}</div>
      <div style="margin-top:8px"><span class="btn" id="cfgstop">停止实时同步</span></div></div>` : ""}
    <div class="grp"><h4>来源 Agent</h4>
      <select id="cfgsrc"><option value="">— 选择 —</option>${others.map(o => `<option value="${esc(o)}"${live && live.parent === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></div>
    <div class="grp" id="cfggrp"><h4>键</h4><div class="note">先选来源</div></div>
    <label class="ck" style="margin-top:6px"><input type="checkbox" id="cfglive" checked> 持续实时同步（推荐；不勾 = 一次性快照）</label>
    <div class="warn" id="mwarn"></div>
    <div class="row">
      ${me.has_backup ? `<span class="btn" id="cfgrevert">还原快照</span>` : ""}
      <span class="btn" id="mcancel">取消</span><span class="btn primary" id="mok">应用</span></div>`);
  document.getElementById("mcancel").onclick = closeModal;
  if (live) document.getElementById("cfgstop").onclick = async () => {
    try { const r = await fetch("/api/config-inherit/disable", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ child: node }) }); if (!r.ok) throw new Error("HTTP " + r.status); closeModal(); await refreshAll(); }
    catch (e) { document.getElementById("mwarn").textContent = "停止失败：" + e.message; }
  };
  if (me.has_backup) document.getElementById("cfgrevert").onclick = async () => {
    try { const r = await fetch("/api/revert-config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ child: node }) }); if (!r.ok) throw new Error("HTTP " + r.status); closeModal(); await refreshAll(); }
    catch (e) { document.getElementById("mwarn").textContent = "还原失败：" + e.message; }
  };
  const loadKeys = async (src) => {
    if (!src) { document.getElementById("cfggrp").innerHTML = `<h4>键</h4><div class="note">先选来源</div>`; return; }
    try {
      const sc = await getJSON(`/api/config/${encodeURIComponent(src)}`);
      const pre = (live && live.parent === src) ? new Set(live.keys || []) : new Set();
      const items = (sc.keys || []).map(k => `<label class="ck"><input type="checkbox" class="cfgck" value="${esc(k)}"${pre.has(k) ? " checked" : ""}> ${esc(k)}</label>`).join("");
      document.getElementById("cfggrp").innerHTML = `<h4>从 ${esc(src)} 继承哪些键</h4>${items || '<div class="note">该来源没有可继承的 config 键</div>'}`;
    } catch (e) { document.getElementById("cfggrp").innerHTML = `<h4>键</h4><div class="note">加载失败：${esc(e.message)}</div>`; }

  if (live && live.parent) loadKeys(live.parent);
  document.getElementById("mok").onclick = async () => {
    const src = document.getElementById("cfgsrc").value;
    const keys = Array.from(document.querySelectorAll(".cfgck:checked")).map(i => i.value);
    const isLive = document.getElementById("cfglive").checked;
    if (!src || !keys.length) { document.getElementById("mwarn").textContent = "请选来源和至少一个键"; return; }
    try {
      const url = isLive ? "/api/config-inherit/enable" : "/api/inherit-config";

      closeModal(); await refreshAll();
    } catch (e) { document.getElementById("mwarn").textContent = "失败：" + e.message; }
  };
}

/* ===== 任务板（kanban：沿组织树派持久任务给常驻 agent） ===== */
function openKanban() { document.getElementById("kanwrap").classList.add("on"); loadKanban(); }
function closeKanban() { document.getElementById("kanwrap").classList.remove("on"); }
async function loadKanban() {
  const wrap = document.getElementById("kanwrap");
  wrap.innerHTML = `<div class="net-head"><span class="ttl">任务板 · Kanban</span><span class="sp"></span>
    <span class="rl" id="kan-reload">刷新</span><span class="rl" id="kan-close" style="margin-left:16px">关闭</span></div>
    <div class="net-body" id="kan-body"><div class="note">加载中…</div></div>`;
  document.getElementById("kan-close").onclick = closeKanban;
  document.getElementById("kan-reload").onclick = loadKanban;
  if (!PROFILES.length) { try { PROFILES = (await getJSON("/api/profiles")).profiles; } catch (e) {} }
  let data, dstat = { running: false };
  try { data = await getJSON("/api/kanban"); }
  catch (e) { document.getElementById("kan-body").innerHTML = `<div class="note">加载失败：${esc(e.message)}</div>`; return; }
  try { dstat = await getJSON("/api/kanban/daemon"); } catch (e) {}
  renderKanban(data, dstat);
}
function renderKanban(data, dstat) {
  const body = document.getElementById("kan-body"), tasks = data.tasks || [];
  dstat = dstat || { running: false };
  const opts = PROFILES.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
  const STAT = ["triage", "todo", "ready", "running", "review", "blocked", "scheduled", "done"];
  const byStat = {};
  tasks.forEach(t => { (byStat[t.status] = byStat[t.status] || []).push(t); });
  const card = t => `<div class="ktask"><div class="kt">${esc(t.title)}</div>
     <div class="km">@${esc(t.assignee || "—")} · ${esc(t.id)}<span class="ka" data-arch="${esc(t.id)}" title="归档">归档</span></div></div>`;
  const cols = STAT.filter(s => byStat[s] && byStat[s].length).map(s => `<div class="kan-col"><h4>${s} · ${byStat[s].length}</h4>${byStat[s].map(card).join("")}</div>`).join("");
  body.innerHTML = `<div class="net-hint">把任务交给某个 AI 长期负责。（AI 自己临时叫的帮手不在这里管。）${data.note ? ` · ⚠ ${esc(data.note)}` : ""}</div>
    <div class="kan-ctl">
      <span class="dstat ${dstat.running ? "on" : ""}">自动派活：${dstat.running ? "进行中" : "已关"}</span>
      <span class="btn" id="dtoggle">${dstat.running ? "关闭自动派活" : "开启自动派活"}</span>
      <span class="btn" id="disp-dry">试运行</span>
      <span class="btn" id="disp-run">立即派一次</span>
      <span class="out" id="disp-out"></span>
    </div>
    <div class="kan-new">
      <input class="t" id="kan-title" placeholder="任务标题…" />
      <select id="kan-assignee">${opts}</select>
      <input id="kan-pri" type="number" placeholder="优先级" style="width:96px" />
      <span class="btn primary" id="kan-create">派活</span>
    </div>
    <div class="kan-cols">${cols || '<div class="note">暂无任务</div>'}</div>`;
  document.getElementById("kan-create").onclick = createTask;
  document.getElementById("dtoggle").onclick = () => toggleDaemon(dstat.running);
  document.getElementById("disp-dry").onclick = () => dispatchOnce(true);
  document.getElementById("disp-run").onclick = () => dispatchOnce(false);
  body.querySelectorAll("[data-arch]").forEach(el => el.addEventListener("click", () => archiveTask(el.dataset.arch)));
}
async function toggleDaemon(running) {
  if (!running && !await confirmAsync("开启后，系统每分钟自动把待办任务交给对应 AI 去做（AI 会真的执行、调用工具）。确定开启？")) return;
  try {
    const r = await fetch("/api/kanban/daemon/" + (running ? "stop" : "start"), { method: "POST" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    loadKanban();
  } catch (e) { toast("操作失败：" + e.message); }
}
async function dispatchOnce(dry) {
  const out = document.getElementById("disp-out");
  if (!dry && !await confirmAsync("现在把待办任务交给对应 AI 去做（会真的执行、调用工具）。确定？")) return;
  out.textContent = dry ? "试运行中…" : "派发中…";
  try {
    const r = await fetch("/api/kanban/dispatch?dry_run=" + (dry ? "true" : "false"), { method: "POST" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
    out.textContent = (dry ? "试运行：" : "已派发：") + JSON.stringify(j.result).slice(0, 180);
    if (!dry) loadKanban();
  } catch (e) { out.textContent = "失败：" + e.message; }
}
async function createTask() {
  const title = document.getElementById("kan-title").value.trim();
  const assignee = document.getElementById("kan-assignee").value;
  const pri = document.getElementById("kan-pri").value;
  if (!title || !assignee) return;
  const b = { title, assignee }; if (pri) b.priority = parseInt(pri, 10);
  try {
    const r = await fetch("/api/kanban/create", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });
    if (!r.ok) { const j = await r.json(); throw new Error(j.detail || ("HTTP " + r.status)); }
    loadKanban();
  } catch (e) { toast("建任务失败：" + e.message); }
}
async function archiveTask(id) {
  if (!await confirmAsync("归档任务 " + id + "？")) return;
  try { const r = await fetch("/api/kanban/archive/" + encodeURIComponent(id), { method: "POST" }); if (!r.ok) throw new Error("HTTP " + r.status); loadKanban(); }
  catch (e) { toast("归档失败：" + e.message); }
}

async function openLintModal() {
  const m = modal(`<h3 style="margin-bottom:6px">技能体检</h3>
    <div class="sub" id="lint-modal-sub">扫描中…</div>

    <div class="row"><span class="btn" id="mcancel">关闭</span></div>`);
  const mb = m.closest(".modal"); if (mb) mb.style.width = "680px";
  document.getElementById("mcancel").onclick = closeModal;
  let data;
  try { data = await getJSON("/api/lint"); }
  catch (e) { document.getElementById("lint-modal-body").innerHTML = `<div class="note">加载失败：${esc(e.message)}</div>`; return; }
  renderLintInto("lint-modal-body", "lint-modal-sub", data);
}
// D2: bundled 技能（hermes 官方 bundle）的违规折叠开关——路径含这些关键字的当 bundled 处理
const BUNDLED_PATTERNS = ["hermes-skill-factory", "open-design", "sleep-tools", "design-mode"];
function isBundledViolation(v) {
  return BUNDLED_PATTERNS.some(p => (v.where || "").includes(p));
}
let LINT_HIDE_BUNDLED = true;  // 默认隐藏 bundled，因为它们不在我们可控范围
function renderLintInto(bodyId, subId, data) {
  const body = document.getElementById(bodyId);
  const subEl = document.getElementById(subId);
  // 按开关过滤
  const profs = (data.profiles || []).map(p => {
    const hard = LINT_HIDE_BUNDLED ? p.hard.filter(v => !isBundledViolation(v)) : p.hard;
    const soft = LINT_HIDE_BUNDLED ? p.soft.filter(v => !isBundledViolation(v)) : p.soft;
    return {...p, hard, soft, hard_count: hard.length, soft_count: soft.length, ok: hard.length === 0};
  }).sort((a, b) => (b.hard_count - a.hard_count) || (b.soft_count - a.soft_count) || a.name.localeCompare(b.name));
  const total_hard = profs.reduce((s, p) => s + p.hard_count, 0);
  const total_soft = profs.reduce((s, p) => s + p.soft_count, 0);
  const total_hard_all = (data.profiles || []).reduce((s, p) => s + p.hard_count, 0);
  const bundled_hidden = total_hard_all - total_hard;
  const viol = (v, hard) => `<div class="lv"><span class="lvb" style="color:${hard ? "#9c5b4f" : "var(--muted)"}">${hard ? "必须修" : "建议"}</span><span class="lw">${esc(v.where)}</span><span class="lm">${esc(v.msg)}</span></div>`;
  const block = p => {
    if (p.ok && !p.soft_count) return `<details class="gp"><summary>${esc(p.name)}<span class="c" style="color:#5e7355">✓ 合规</span></summary><div class="note" style="padding:6px 0">无违规</div></details>`;
    const rows = p.hard.map(v => viol(v, true)).join("") + p.soft.map(v => viol(v, false)).join("");
    const tag = `${p.hard_count ? p.hard_count + " 必修" : ""}${p.hard_count && p.soft_count ? " · " : ""}${p.soft_count ? p.soft_count + " 建议" : ""}`;
    return `<details class="gp" ${p.hard_count ? "open" : ""}><summary>${esc(p.name)}<span class="c" style="color:${p.hard_count ? "#9c5b4f" : "var(--muted)"}">${tag}</span></summary>${rows}</details>`;
  };
  if (subEl) {
    subEl.innerHTML = `合计 ${total_hard} 个必须修 · ${total_soft} 个建议优化。检查每个 AI 自带技能的设置是否规范。
      <label style="margin-left:14px; cursor:pointer; user-select:none">
        <input type="checkbox" id="lint-hide-bundled" ${LINT_HIDE_BUNDLED ? "checked" : ""}>
        隐藏系统自带技能的问题${bundled_hidden ? ` (${bundled_hidden} 条)` : ""}
      </label>`;
    document.getElementById("lint-hide-bundled").onchange = (e) => {
      LINT_HIDE_BUNDLED = e.target.checked;
      renderLintInto(bodyId, subId, data);
    };
  }
  body.innerHTML = profs.map(block).join("");
}

      ? `<div class="dash-empty">尚无任何变更记录</div>`
      : ch.map(c => `<div class="dash-change">
          <span class="ago">${esc(c.ago)}</span>
          <span class="desc" title="${esc(c.when)} · ${esc(c.summary)}">${esc(c.target)}</span>
        </div>`).join("")}
  </div>`;
  document.getElementById("dash-body").innerHTML =
    `<div class="net-hint">系统健康 · 待你处理 · 最近改动，三块一眼看全。<br>生成于 ${esc(d.generated_at)}。</div>
     <div class="dash-grid">${healthCard}${reviewCard}${changesCard}</div>`;
  // review 行点击 → 关闭面板 + 选中对应 profile
  document.querySelectorAll(".dash-review[data-go]").forEach(el => {
    el.onclick = () => {
      const name = el.dataset.go;
      closeDashboard();
      if (PROFILES.some(p => p.name === name)) selectProfile(name);
    };
  });
  // B1: 点违规数 → 打开 lint detail modal（替代独立 lintwrap 面板）
  document.querySelectorAll(".dash-row.clickable[data-lint]").forEach(el => {
    el.onclick = () => openLintModal();
  });
}

/* ===== Kill switch：停用/恢复一个 agent（仪表盘级闸，级联子树，可逆） ===== */
async function toggleKill(name, killed) {
  const msg = killed
    ? `停用「${name}」？会挡掉它（及其子树）经仪表盘开终端 / 派任务，随时可恢复，不删任何东西。`
    : `恢复「${name}」？`;
  if (!await confirmAsync(msg)) return;
  try {
    const r = await fetch("/api/kill", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, killed }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
    await load();              // 刷新侧栏置灰
    if (current === name) openInfo(name);  // 刷新面板按钮
  } catch (e) { toast("操作失败：" + e.message, "bad"); }
}

/* ===== Constitution（宪法）：全局强制红线，注入各订阅 agent 的 SOUL.md 顶部受管块 ===== */
function openConst() { document.getElementById("constwrap").classList.add("on"); loadConst(); }
function closeConst() { document.getElementById("constwrap").classList.remove("on"); }
async function loadConst() {
  const wrap = document.getElementById("constwrap");
  wrap.innerHTML = `<div class="net-head"><span class="ttl">宪法 · Constitution</span><span class="sp"></span>
    <span class="rl" id="const-reload">刷新</span><span class="rl" id="const-close" style="margin-left:16px">关闭</span></div>
    <div class="net-body" id="const-body"><div class="note">加载中…</div></div>`;
  document.getElementById("const-close").onclick = closeConst;
  document.getElementById("const-reload").onclick = loadConst;
  let data;
  try { data = await getJSON("/api/constitution"); }
  catch (e) { document.getElementById("const-body").innerHTML = `<div class="note">加载失败：${esc(e.message)}</div>`; return; }
  renderConst(data);
}
function renderConst(data) {
  const body = document.getElementById("const-body");
  const applied = new Set(data.applied || []);
  const subs = (data.profiles || []).map(n => `<label class="csub"><input type="checkbox" data-sub="${esc(n)}" ${applied.has(n) ? "checked" : ""}/> ${esc(n)}</label>`).join("");
  body.innerHTML = `<div class="net-hint">这份"宪法"（红线 / 目标 / 风格）会自动加到<b>订阅</b>它的每个 AI 的设定开头（它们各自的人格不受影响）。内容你自己写；改完点「保存并同步」会刷进所有订阅的 AI。它是写进设定里的<b>强引导</b>，不是硬性拦截。</div>
    <div class="cedit"><textarea id="const-text" spellcheck="false" placeholder="例：&#10;## 红线&#10;- 未经我确认不得花钱 / 不得删除文件&#10;## 目标&#10;- 优先简洁、说人话&#10;## 风格&#10;- 中文回答，先结论后细节">${esc(data.text || "")}</textarea></div>
    <div class="kan-ctl"><span class="btn primary" id="const-save">保存并同步</span><span class="out" id="const-out"></span></div>
    <h3 style="margin:18px 0 6px">哪些 AI 订阅（勾上=应用这套规则，取消=移除）</h3>
    <div class="csubs">${subs}</div>`;
  document.getElementById("const-save").onclick = async () => {
    const out = document.getElementById("const-out"); out.textContent = "保存中…";
    try {
      const r = await fetch("/api/constitution", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: document.getElementById("const-text").value }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      out.textContent = `已保存并同步到 ${j.applied.length} 个 agent`;
    } catch (e) { out.textContent = "失败：" + e.message; }
  };
  body.querySelectorAll("[data-sub]").forEach(el => el.addEventListener("change", async () => {
    const nm = el.dataset.sub, on = el.checked;
    if (!await confirmAsync(on ? `让「${nm}」应用这套规则？会加到它的设定开头（自动备份原设定）。` : `取消「${nm}」的规则？会恢复它原来的设定。`)) { el.checked = !on; return; }
    try {
      const r = await fetch("/api/constitution/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: nm, on }) });
      if (!r.ok) { const j = await r.json(); throw new Error(j.detail || ("HTTP " + r.status)); }
    } catch (e) { toast("操作失败：" + e.message, "bad"); el.checked = !on; }
  }));
}

document.getElementById("net-open").addEventListener("click", openNetwork);
document.getElementById("kan-open").addEventListener("click", openKanban);
document.getElementById("const-open").addEventListener("click", openConst);
document.getElementById("vault-open").addEventListener("click", openVault);
document.getElementById("new-agent").addEventListener("click", openNewAgentDialog);
document.getElementById("dash-open").addEventListener("click", openDashboard);
document.getElementById("scrim").addEventListener("click", closeInfo);
document.getElementById("modal-scrim").addEventListener("click", e => { if (e.target.id === "modal-scrim") closeModal(); });

/* E2: 侧栏搜索框输入即过滤 + `/` 快捷键聚焦 */
const _navFilterEl = document.getElementById("nav-filter");
if (_navFilterEl) _navFilterEl.addEventListener("input", applyNavFilter);

/* E1: 键盘快捷键
   `?` 弹帮助 / `Esc` 关闭对话框 / `/` 聚焦搜索 / `g d` 仪表盘 / `g r` 关系网 / `g k` 任务板 / `g c` 宪法 / `Ctrl+P` 命令面板（暂以搜索框替代） */
let _gPrefix = false;
function showKeyHelp() {
  const m = modal(`<h3>键盘快捷键</h3>
    <div class="sub">所有快捷键在没聚焦输入框时生效。</div>
    <div class="grp"><h4>导航</h4>
      <div class="fld"><div class="lbl">/</div><div class="val">聚焦侧栏搜索框</div></div>
      <div class="fld"><div class="lbl">g d</div><div class="val">打开仪表盘</div></div>
      <div class="fld"><div class="lbl">g r</div><div class="val">打开关系网</div></div>
      <div class="fld"><div class="lbl">g k</div><div class="val">打开任务板</div></div>
      <div class="fld"><div class="lbl">g c</div><div class="val">打开宪法</div></div>
      <div class="fld"><div class="lbl">g v</div><div class="val">打开知识库</div></div>
      <div class="fld"><div class="lbl">g n</div><div class="val">新建空 agent</div></div>
    </div>
    <div class="grp"><h4>通用</h4>
      <div class="fld"><div class="lbl">?</div><div class="val">显示此帮助</div></div>
      <div class="fld"><div class="lbl">Esc</div><div class="val">关闭对话框 / 详情面板</div></div>
    </div>
    <div class="row"><span class="btn primary" id="mcancel">明白了</span></div>`);
  document.getElementById("mcancel").onclick = closeModal;
}
document.addEventListener("keydown", e => {
  // 输入框聚焦时不拦截（除了 Esc）
  const inInput = ["INPUT", "TEXTAREA"].includes((e.target.tagName || ""));
  if (e.key === "Escape") { closeModal(); closeInfo(); _gPrefix = false; return; }
  if (inInput) return;
  if (e.key === "/") { e.preventDefault(); const f = document.getElementById("nav-filter"); if (f) f.focus(); return; }
  if (e.key === "?") { e.preventDefault(); showKeyHelp(); return; }
  if (e.key === "g") { _gPrefix = true; setTimeout(() => { _gPrefix = false; }, 1200); return; }
  if (_gPrefix) {
    _gPrefix = false;
    if (e.key === "d") openDashboard();
    else if (e.key === "r") openNetwork();
    else if (e.key === "k") openKanban();
    else if (e.key === "c") openConst();
    else if (e.key === "v") openVault();
    else if (e.key === "n") openNewAgentDialog();
  }
});
load();
</script>
