<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes</title>
<link rel="stylesheet" href="/static/vendor/xterm.css" />
<style>
  :root {
    --bg: #ffffff;
    --side: #f4f3f1;
    --side-hover: #eeece8;
    --side-active: #e7e4de;
    --hair: #e4e2dd;
    --hair-strong: #d6d3cc;
    --ink: #2b2a28;
    --muted: #8a8782;
    --faint: #b4b1aa;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
            "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; -webkit-font-smoothing: antialiased; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- sidebar (Nordic minimal, monochrome) ---------- */
  .side { width: 280px; flex: none; background: var(--side);
    border-right: 1px solid var(--hair); display: flex; flex-direction: column; }
  .side-head { padding: 22px 20px 10px; }
  .brand { font-size: 15px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: baseline; }
  .brand small { display: block; font-size: 10.5px; font-weight: 400; letter-spacing: .18em;
    color: var(--faint); margin-top: 5px; text-transform: uppercase; }
  .brand .src { margin-left: auto; font: 9.5px var(--mono); color: var(--faint); letter-spacing: .04em;
    text-transform: none; align-self: center; }
  /* 纵向操作列表（参考 Claude）：每项独占整行，2 字标签不再竖断，字数容错高 */
  .side-actions { display: flex; flex-direction: column; gap: 1px; padding: 4px 12px 8px; }
  .sa-btn { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font: 12.5px var(--mono);
    color: var(--muted); cursor: pointer; border-radius: 6px; white-space: nowrap; user-select: none; }
  .sa-btn:hover { background: var(--side-hover); color: var(--ink); }
  .sa-btn .ic { width: 14px; text-align: center; color: var(--faint); flex: none; }
  .sa-btn:hover .ic { color: var(--ink); }
  /* "新建 agent" 是动作不是视图 → 绿色虚框强调 */
  .sa-btn.new { color: #5e7355; }
  .sa-btn.new .ic { color: #5e7355; }
  .sa-btn.new:hover { background: #eaf0e6; }
  /* 主区顶部刷新图标按钮 */
  .top .lnk { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .top .lnk:hover { color: var(--ink); }
  #top-reload { font-size: 15px; }

  /* E2: 侧栏搜索框 */
  .side-search { padding: 0 18px 6px; }
  .side-search input { width: 100%; padding: 6px 9px; font: 12px var(--mono); border: 1px solid var(--hair);
    border-radius: 6px; background: #fff; color: var(--ink); }
  .side-search input:focus { outline: none; border-color: var(--hair-strong); }
  .nav { flex: 1; overflow-y: auto; padding: 6px 12px 24px; }
  .nav.filtered .snode.fhide { display: none; }
  .nav.filtered .it.fmatch { background: #efe9d8; }
  .grp { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
    padding: 20px 8px 8px; }
  .it { display: flex; align-items: baseline; gap: 8px; padding: 8px 8px; cursor: pointer;
    border-left: 1px solid transparent; }
  .it:hover { background: var(--side-hover); }
  /* 可拖的行 hover 显示抓手光标，提示"可以拖动改上级"（点击选中仍然可用） */
  .it[draggable="true"]:hover { cursor: grab; }
  .it[draggable="true"]:active { cursor: grabbing; }
  .it.on { background: var(--side-active); border-left-color: var(--ink); }
  .it.drag { opacity: .4; }
  .it.drop { background: var(--side-active); box-shadow: inset 0 0 0 1px var(--ink); border-radius: 6px; }
  .it .nm { font: 13px var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 2.5em; }
  /* 徽章不竖排折行：nowrap + 不参与挤压 */
  .it .role { font-size: 10.5px; color: var(--faint); letter-spacing: .04em; white-space: nowrap; flex: none; }
  /* 侧栏项 ⋯ 菜单按钮（hover 出现，仿 Claude desktop） */
  .it .mbtn { flex: none; color: var(--faint); cursor: pointer; opacity: 0; padding: 0 3px; font-size: 15px; line-height: 1; }
  .it:hover .mbtn { opacity: 1; }
  .it .mbtn:hover { color: var(--ink); }
  .ctx-menu { position: fixed; z-index: 85; background: var(--bg); border: 1px solid var(--hair-strong);
    border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.1); padding: 4px; min-width: 132px; display: none; }
  .ctx-menu.on { display: block; }
  .ctx-menu .mi { padding: 7px 12px; font: 12.5px var(--mono); color: var(--ink); cursor: pointer; border-radius: 5px; display: flex; gap: 8px; align-items: center; }
  .ctx-menu .mi:hover { background: var(--side-hover); }
  .ctx-menu .mi.danger { color: #9c5b4f; }
  .ctx-menu .mi .ic { width: 14px; text-align: center; color: var(--faint); }
  .ctx-menu .mi.danger .ic { color: #9c5b4f; }
  /* 置顶区：pin 的 agent 在侧栏最上方做快捷分身，点了跳真 profile，原树位置不动 */
  .pinned-wrap { padding: 2px 12px 8px; border-bottom: 1px dashed var(--hair); margin-bottom: 4px; }
  .pin-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 6px;
    font: 12.5px var(--mono); color: var(--ink); }
  .pin-row:hover { background: var(--side-hover); }
  .pin-row.on { background: var(--side-active); }
  .pin-row .pic { color: #9c8b4a; flex: none; font-size: 11px; }
  .pin-row .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin-row .unpin { color: var(--faint); opacity: 0; flex: none; padding: 0 3px; }
  .pin-row:hover .unpin { opacity: 1; }
  .pin-row .unpin:hover { color: #9c5b4f; }
  /* gw 圆点不再用 margin-left:auto（那会吃掉空闲宽度、压住 .nm 的 flex 生长→名字截断）；
     改成跟在 role 后面的固定小间距，名字就能用满剩余宽度 */
  .it .gw { flex: none; align-self: center; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); opacity: 0; }
  .it .gw.run { opacity: .85; }
  /* 树状侧栏：折叠箭头 + 连接线 */
  .grp { cursor: pointer; user-select: none; display: flex; align-items: center; }
  .grp .gtw { margin-left: 6px; font-size: 9px; color: var(--faint); }
  .grp-body.hide { display: none; }
  .tw { flex: none; width: 12px; text-align: center; font-size: 9px; line-height: 1; color: var(--faint);
    cursor: pointer; align-self: center; user-select: none; }
  .tw:hover { color: var(--ink); }
  .tw.empty { cursor: default; }
  .subtree { margin-left: 11px; border-left: 1px solid var(--hair); }
  .subtree > .snode > .it { position: relative; }
  .subtree > .snode > .it::before { content: ""; position: absolute; left: -11px; top: 16px;
    width: 9px; height: 1px; background: var(--hair); }
  /* 侧栏草稿提示行：单行摘要 + "点击 → 关系网处理"，避免和关系网面板里的可拖卡片重复展示 */
  .drafts-wrap { margin-top: 18px; padding-top: 6px; border-top: 1px dashed var(--hair); }
  .drafts-summary { padding: 8px 10px; font: 11.5px var(--mono); color: var(--muted);
    cursor: pointer; border-radius: 6px; border: 1px dashed var(--hair); margin: 2px 8px; }
  .drafts-summary:hover { background: var(--side-hover); border-style: solid; }
  .drafts-summary .hint { font-size: 10.5px; color: var(--faint); margin-left: 8px; }

  /* ---------- main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 380px; padding: 24px; }
  .welcome .k { font: 13px var(--mono); color: var(--faint); letter-spacing: .04em; }
  .welcome p { margin: 12px 0 0; font-size: 13px; line-height: 1.6; }

  .top { display: flex; align-items: baseline; gap: 12px; padding: 14px 22px;
    border-bottom: 1px solid var(--hair); flex: none; }
  .top .nm { font: 15px var(--mono); color: var(--ink); }
  .top .meta { font: 11px var(--mono); color: var(--faint); letter-spacing: .03em; }
  .top .sp { margin-left: auto; }
  .lnk { font-size: 12px; color: var(--muted); cursor: pointer; margin-left: 18px; letter-spacing: .04em; }
  .lnk:hover { color: var(--ink); }

  .term-host { flex: 1; position: relative; min-height: 0; background: var(--bg); }
  .term-wrap { position: absolute; inset: 0; background: var(--bg); }
  .term { position: absolute; inset: 14px 10px 10px 18px; }
  .term-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); font-size: 13px; padding: 24px; line-height: 1.6; }
  .term-hint code { font-family: var(--mono); font-size: 12px; color: var(--ink); }

  /* ---------- info drawer (monochrome) ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(43,42,40,.28); opacity: 0; pointer-events: none;
    transition: opacity .16s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .info { position: fixed; top: 0; right: 0; height: 100%; width: 430px; max-width: 92vw; background: var(--bg);
    border-left: 1px solid var(--hair); z-index: 50; transform: translateX(100%); transition: transform .18s;
    overflow-y: auto; }
  .info.on { transform: translateX(0); }
  .info-head { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--hair);
    padding: 17px 22px; display: flex; align-items: baseline; gap: 10px; }
  .info-head .nm { font: 15px var(--mono); }
  .info-head .role { font-size: 11px; color: var(--faint); letter-spacing: .04em; }
  .x { margin-left: auto; cursor: pointer; border: none; background: none; font-size: 20px; line-height: 1;
    color: var(--muted); padding: 2px 6px; }
  .x:hover { color: var(--ink); }
  .info-body { padding: 18px 22px 50px; }
  .blk { margin-top: 24px; } .blk:first-child { margin-top: 2px; }
  .blk > h3 { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
    margin: 0 0 10px; font-weight: 500; }
  .meta-line { font: 12px var(--mono); color: var(--muted); }
  /* 6 分区的 field-row 表格布局：标签 160 / 值 1fr。conventions §7 schema 对齐。 */
  .fld { display: grid; grid-template-columns: 160px 1fr; gap: 12px 14px; padding: 6px 0;
    border-bottom: 1px dotted var(--hair); align-items: baseline; }
  .fld:last-child { border-bottom: 0; }
  .fld > .lbl { font: 11px var(--mono); color: var(--faint); letter-spacing: .06em;
    text-transform: lowercase; padding-top: 2px; }
  .fld > .val { font: 12.5px var(--mono); color: var(--ink); word-break: break-all; }
  /* C3: pill 收敛到 3 色语义：ok=绿（健康/启用/自有）· inh=黄（继承/警告）· bad=红（停用/违规/错误） */
  .fld > .val .pill { display: inline-block; padding: 1px 7px; margin: 2px 4px 2px 0;
    background: var(--side-active); color: var(--ink); border-radius: 4px; font-size: 11px; }
  .fld > .val .pill.ok { background: #eaf0e6; color: #5e7355; }
  .fld > .val .pill.inh { background: #efe9d8; color: #6a5e3a; }
  .fld > .val .pill.bad { background: #f3e7e3; color: #9c5b4f; }
  /* .warn 是 inh 的别名（保留以兼容旧 HTML 字符串），新代码请直接用 inh */
  .fld > .val .pill.warn { background: #efe9d8; color: #6a5e3a; }
  .blk-h-meta { font-size: 10.5px; color: var(--faint); margin-left: 8px; letter-spacing: 0;
    text-transform: none; font-weight: 400; }
  /* 子任务卡 / 备份历史 */
  .subtask-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 4px; }
  .subtask-card { background: #fff; border: 1px solid var(--hair); border-radius: 7px; padding: 9px 11px; cursor: pointer; }
  .subtask-card:hover { background: var(--side-hover); }
  .subtask-card.dashed { border-style: dashed; color: var(--muted); text-align: center; }
  .subtask-card .st-t { font: 12px var(--mono); color: var(--ink); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; }
  .subtask-card .st-m { font: 10.5px var(--mono); color: var(--faint); display: flex; gap: 6px; }
  .bkp-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--hair); font: 11.5px var(--mono); }
  .bkp-row:last-child { border-bottom: 0; }
  .bkp-row .ago { color: var(--faint); min-width: 70px; flex: none; }
  .bkp-row .file { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .bkp-row .act { color: #5e7355; cursor: pointer; font-size: 11px; text-decoration: underline dotted; flex: none; }
  .bkp-row .act:hover { color: var(--ink); }
  .bkp-fold summary { cursor: pointer; font: 11.5px var(--mono); color: var(--muted); padding: 4px 0; list-style: none; }
  .bkp-fold summary:hover { color: var(--ink); }
  .bkp-fold summary::-webkit-details-marker { display: none; }
  .bkp-fold[open] summary::after { content: " ▾"; color: var(--faint); }
  .bkp-fold summary::after { content: " ▸"; color: var(--faint); }
  /* 影响范围 */
  .impact-row { font: 11.5px var(--mono); padding: 5px 0; border-bottom: 1px dotted var(--hair); }
  .impact-row:last-child { border-bottom: 0; }
  .impact-row .lab { color: var(--muted); margin-right: 8px; }
  .impact-row .num { color: var(--ink); font-weight: 600; }
  .impact-row .nms { color: var(--faint); font-size: 11px; }
  .soul { font: 12px var(--mono); white-space: pre-wrap; color: var(--ink);
    border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
    padding: 12px 0; max-height: 200px; overflow: auto; }
  /* 知识库：全局 vault 面板的文件夹树 + 笔记项 */
  .vault-tree { font: 12.5px var(--mono); max-width: 820px; margin-top: 12px; }
  .vault-empty { color: var(--faint); font: 11.5px var(--mono); padding: 6px 0 6px 22px; }
  .vdir { margin: 1px 0; }
  .vdir > summary { cursor: pointer; padding: 4px 6px; border-radius: 6px; color: var(--ink);
    list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
  .vdir > summary::-webkit-details-marker { display: none; }
  .vdir > summary::before { content: "▸"; color: var(--faint); font-size: 10px; width: 9px; display: inline-block; }
  .vdir[open] > summary::before { content: "▾"; }
  .vdir > summary:hover { background: var(--side-hover); }
  .vdir-name { font-weight: 600; }
  .vdir-c { color: var(--faint); font-size: 11px; }
  .vdir-body { padding-left: 14px; border-left: 1px solid var(--hair); margin-left: 10px; }
  .vfile { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 24px;
    border-radius: 6px; cursor: pointer; }
  .vfile:hover { background: var(--side-active); }
  .vfile .vf-name { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vfile .vf-meta { color: var(--faint); font-size: 11px; flex: none; }
  /* 笔记预览弹窗 */
  .modal.wide { width: 640px; }
  .vault-content { font: 12px var(--mono); white-space: pre-wrap; color: var(--ink);
    background: #fafaf7; border: 1px solid var(--hair); border-radius: 7px; padding: 12px 14px;
    max-height: 360px; overflow: auto; margin-top: 8px; }
  /* 渲染后的 markdown 视图（与 raw 切换） */
  .vault-md { background: #fafaf7; border: 1px solid var(--hair); border-radius: 7px;
    padding: 14px 18px; max-height: 360px; overflow: auto; margin-top: 8px;
    font: 13px/1.65 -apple-system, var(--mono); color: var(--ink); }
  .vault-md h1, .vault-md h2, .vault-md h3 { margin: 14px 0 8px; font-weight: 600; color: var(--ink); }
  .vault-md h1 { font-size: 17px; border-bottom: 1px solid var(--hair); padding-bottom: 4px; }
  .vault-md h2 { font-size: 15px; }
  .vault-md h3 { font-size: 13.5px; color: var(--muted); }
  .vault-md p { margin: 6px 0; }
  .vault-md code { font: 12px var(--mono); background: var(--side-active); padding: 1px 5px; border-radius: 3px; }
  .vault-md pre { background: var(--side-active); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  .vault-md pre code { background: transparent; padding: 0; }
  .vault-md ul, .vault-md ol { margin: 4px 0; padding-left: 22px; }
  .vault-md li { margin: 2px 0; }
  .vault-md blockquote { border-left: 3px solid var(--hair-strong); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .vault-md a { color: #5e7355; text-decoration: underline; text-decoration-style: dotted; }
  .vault-md .wikilink { color: #5e7355; background: #eaf0e6; padding: 0 4px; border-radius: 3px;
    font-size: 12px; text-decoration: none; }
  .vault-view-toggle { display: inline-flex; gap: 6px; margin-top: 8px; }
  .vault-view-toggle .tg { font: 10.5px var(--mono); padding: 3px 9px; border: 1px solid var(--hair);
    border-radius: 5px; cursor: pointer; color: var(--muted); user-select: none; }
  .vault-view-toggle .tg.on { background: var(--side-active); color: var(--ink); border-color: var(--hair-strong); }
  details.gp { border-top: 1px solid var(--hair); }
  details.gp > summary { cursor: pointer; list-style: none; padding: 9px 0; font: 12.5px var(--mono);
    display: flex; align-items: center; gap: 8px; color: var(--ink); }
  details.gp > summary::-webkit-details-marker { display: none; }
  details.gp > summary .c { margin-left: auto; color: var(--faint); font-size: 11px; }
  .sk { padding: 7px 0 7px 14px; border-top: 1px solid var(--hair); border-left: 1px solid transparent; }
  .sk .sn { font: 12px var(--mono); color: var(--ink); }
  .sk .sd { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.5; }
  .lv { display: flex; gap: 9px; align-items: baseline; padding: 6px 0 6px 14px; border-top: 1px solid var(--hair); font-size: 12px; }
  .lv .lvb { flex: none; font-size: 10.5px; letter-spacing: .04em; }
  .lv .lw { flex: none; font: 11.5px var(--mono); color: var(--ink); }
  .lv .lm { color: var(--muted); }
  .it.dead .nm { opacity: .55; text-decoration: line-through; }
  .cedit textarea { width: 100%; min-height: 280px; box-sizing: border-box; padding: 12px 14px; font: 12.5px var(--mono);
    line-height: 1.6; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .csubs { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .csub { display: flex; align-items: center; gap: 6px; font: 12.5px var(--mono); color: var(--ink); cursor: pointer; }
  .sess { border-top: 1px solid var(--hair); padding: 9px 0; }
  .sess .t { font-size: 13px; color: var(--ink); }
  .sess .m2 { color: var(--faint); font: 11px var(--mono); margin-top: 3px; }
  .note { color: var(--muted); font-size: 12px; }

  /* ---------- conversation tabs ---------- */
  .tabbar { flex: none; display: flex; align-items: stretch; gap: 2px; padding: 6px 12px 0;
    border-bottom: 1px solid var(--hair); overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 7px; max-width: 210px; padding: 7px 9px 8px;
    font: 12px var(--mono); color: var(--muted); cursor: pointer; border: 1px solid transparent;
    border-bottom: none; border-radius: 7px 7px 0 0; margin-bottom: -1px; }
  .tab:hover { background: var(--side-hover); }
  .tab.on { background: var(--bg); color: var(--ink); border-color: var(--hair); }
  .tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .cl { color: var(--faint); font-size: 14px; line-height: 1; padding: 0 1px; border-radius: 4px; }
  .tab .cl:hover { color: #9c5b4f; background: var(--side-active); }
  .tab-add { flex: none; padding: 7px 11px 8px; font: 14px var(--mono); color: var(--muted);
    cursor: pointer; border-radius: 7px; }
  .tab-add:hover { background: var(--side-hover); color: var(--ink); }
  .tab-sync { flex: none; margin-left: auto; align-self: center; font-size: 13px; color: var(--faint);
    cursor: pointer; padding: 0 8px; }
  .tab-sync:hover { color: var(--ink); }

  .btn { font: 12px var(--mono); cursor: pointer; border: 1px solid var(--hair-strong); background: #fff;
    color: var(--ink); border-radius: 7px; padding: 8px 15px; }
  .btn:hover { background: var(--side); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #000; }

  /* ---------- network (org tree) ---------- */
  .netwrap { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: none; flex-direction: column; }
  .netwrap.on { display: flex; }
  /* 面板头部的"刷新/关闭"等切换链接统一样式（基础 .rl，过去缺这条） */
  .rl { cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .rl:hover { color: var(--ink); }
  .net-head { display: flex; align-items: baseline; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--hair); flex: none; }
  .net-head .ttl { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .net-head .sp { margin-left: auto; }
  .net-body { flex: 1; overflow: auto; padding: 20px 24px 60px; }
  .net-hint { color: var(--faint); font-size: 12px; margin-bottom: 16px; line-height: 1.65; max-width: 760px; }
  /* 仪表盘卡片网格：3 张零基建卡（系统健康 / 待你 Review / 最近变更） */
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .dash-card { background: #fff; border: 1px solid var(--hair); border-radius: 12px; padding: 18px 20px;
    display: flex; flex-direction: column; min-height: 240px; }
  .dash-card h4 { margin: 0 0 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; }
  .dash-card .lead { font: 22px var(--mono); color: var(--ink); margin-bottom: 4px; }
  .dash-card .sub-meta { color: var(--muted); font-size: 12px; line-height: 1.75; }
  .dash-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0;
    border-bottom: 1px dotted var(--hair); font-size: 12.5px; }
  .dash-row:last-child { border-bottom: 0; }
  .dash-row .lbl { color: var(--muted); }
  .dash-row .val { font: 13px var(--mono); color: var(--ink); }
  .dash-row.clickable { cursor: pointer; }
  .dash-row.clickable:hover { background: var(--side-hover); }
  .dash-row .val.bad { color: #9c5b4f; }
  .dash-row .val.warn { color: #9c8b4a; }
  .dash-row .val.ok { color: #5e7355; }
  .dash-review { font: 12.5px var(--mono); padding: 7px 9px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--hair); margin: 5px 0; background: #fff; }
  .dash-review:hover { background: var(--side-hover); border-color: var(--hair-strong); }
  .dash-review .who { color: var(--ink); }
  .dash-review .what { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .dash-change { font: 11.5px var(--mono); padding: 7px 9px; border-bottom: 1px dotted var(--hair); display: flex; gap: 10px; align-items: baseline; }
  .dash-change:last-child { border-bottom: 0; }
  .dash-change .ago { color: var(--faint); flex: none; min-width: 70px; }
  .dash-change .desc { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  .dash-empty { color: var(--faint); font: 11.5px var(--mono); padding: 14px 0; text-align: center; }
  /* 关系网：自上而下的组织架构图（org chart）—— 嵌套 ul/li + 伪元素连线，一眼看出第一/二/三层 */
  .org { display: inline-block; min-width: 100%; padding: 4px 0 40px; text-align: center; }
  .org ul { position: relative; padding-top: 22px; white-space: nowrap; margin: 0; list-style: none; }
  .org > ul { padding-top: 0; }
  .org li { display: inline-block; vertical-align: top; list-style: none; position: relative;
    padding: 22px 8px 0; }
  /* 兄弟之间的横线 + 到上方汇合点的竖线 */
  .org li::before, .org li::after { content: ""; position: absolute; top: 0; right: 50%;
    border-top: 1px solid var(--hair-strong); width: 50%; height: 22px; }
  .org li::after { right: auto; left: 50%; border-left: 1px solid var(--hair-strong); }
  .org li:only-child::before, .org li:only-child::after { display: none; }
  .org li:only-child { padding-top: 22px; }
  .org li:first-child::before, .org li:last-child::after { border: 0 none; }
  .org li:last-child::before { border-right: 1px solid var(--hair-strong); border-radius: 0 6px 0 0; }
  .org li:first-child::after { border-radius: 6px 0 0 0; }
  /* 父节点底部到子级横线的那根竖线 */
  .org ul ul::before { content: ""; position: absolute; top: 0; left: 50%;
    border-left: 1px solid var(--hair-strong); width: 0; height: 22px; }
  /* 节点盒子 */
  .onode { display: inline-block; text-align: left; border: 1px solid var(--hair); border-radius: 9px;
    background: #fff; padding: 8px 12px; min-width: 120px; cursor: grab; vertical-align: top; transition: box-shadow .12s; }
  .onode:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); border-color: var(--hair-strong); }
  .onode.drag { opacity: .4; }
  .onode.drop { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .onode.root { border-color: var(--ink); }
  .onode .on-top { display: flex; align-items: baseline; gap: 6px; }
  .onode .on-nm { font: 13px var(--mono); color: var(--ink); }
  .onode .on-tag { font-size: 9.5px; padding: 0 5px; border-radius: 3px; }
  .onode .on-tag.twin { color: #5e7355; background: #eaf0e6; }
  .onode .on-tag.bad { color: #9c5b4f; background: #f3e7e3; }
  .onode .on-tag.warn { color: #6a5e3a; background: #efe9d8; }
  .onode .on-meta { font: 10.5px var(--mono); color: var(--faint); margin-top: 3px; }
  .onode .on-acts { display: none; gap: 10px; margin-top: 7px; padding-top: 6px; border-top: 1px dotted var(--hair); }
  .onode:hover .on-acts { display: flex; }
  .onode .act { font-size: 10.5px; color: var(--muted); cursor: pointer; }
  .onode .act:hover { color: var(--ink); }
  .droptop { border: 1px dashed var(--hair-strong); border-radius: 9px; padding: 9px 12px; margin: 2px 0 16px;
    color: var(--faint); font-size: 12px; text-align: center; }
  .droptop.drop { border-color: var(--ink); color: var(--ink); background: var(--side-active); }

  /* ---------- modal ---------- */
  .modal-scrim { position: fixed; inset: 0; background: rgba(43,42,40,.4); z-index: 70; display: none;
    align-items: center; justify-content: center; }
  .modal-scrim.on { display: flex; }
  .modal { background: var(--bg); border: 1px solid var(--hair-strong); border-radius: 12px; width: 470px;
    max-width: 92vw; max-height: 86vh; overflow: auto; padding: 20px 22px; }
  .modal h3 { margin: 0 0 6px; font-size: 14px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; line-height: 1.55; }
  .modal .grp { margin-top: 14px; }
  .modal .grp > h4 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  .modal .ck { display: flex; align-items: center; gap: 9px; padding: 6px 0; font: 12.5px var(--mono); cursor: pointer; }
  .modal .ck input { accent-color: var(--ink); }
  .modal select { font: 12.5px var(--mono); padding: 6px 8px; border: 1px solid var(--hair-strong); border-radius: 7px; width: 100%; }
  .modal .row { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
  .modal .warn { color: #9c5b4f; font-size: 12px; margin-top: 10px; min-height: 1em; }
  /* C1: 自定义 toast + 异步 confirm，替代原生 alert/confirm（视觉一致 + Chrome 自动化友好） */
  .toast-stack { position: fixed; top: 20px; right: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none; max-width: 380px; }
  .toast { background: var(--bg); border: 1px solid var(--hair-strong); border-left: 3px solid var(--ink);
    border-radius: 7px; padding: 10px 14px; font: 12.5px var(--mono); color: var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,.06); pointer-events: auto; animation: toast-in .18s ease-out; max-width: 100%; word-break: break-word; }
  .toast.ok { border-left-color: #5e7355; }
  .toast.warn { border-left-color: #9c8b4a; }
  .toast.bad { border-left-color: #9c5b4f; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(8px) } to { opacity: 1; transform: translateX(0) } }
  /* tab 化的落位预演对话框 */
  .modal .tabs { display: flex; gap: 0; margin: 12px 0 0; border-bottom: 1px solid var(--hair); }
  .modal .tab { padding: 7px 14px; font: 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
  .modal .tab:hover { color: var(--muted); }
  .modal .tab.on { color: var(--ink); border-bottom-color: var(--ink); }
  .modal .tab .pill { display: inline-block; min-width: 16px; height: 16px; padding: 0 5px; margin-left: 6px;
    background: var(--side-active); color: var(--ink); border-radius: 9px; font: 10px var(--mono);
    line-height: 16px; text-align: center; letter-spacing: 0; }
  .modal .tabpane { display: none; padding-top: 12px; min-height: 140px; }
  .modal .tabpane.on { display: block; }
  .modal .chain { font: 11.5px var(--mono); color: var(--muted); padding: 6px 0; word-break: break-all; }
  .modal .chain .arr { color: var(--faint); margin: 0 6px; }
  .modal .chain .self { color: var(--ink); font-weight: 600; }
  .modal .diffrow { font: 12px var(--mono); padding: 5px 0; display: flex; gap: 8px; align-items: baseline;
    border-bottom: 1px dotted var(--hair); }
  .modal .diffrow:last-child { border-bottom: 0; }
  .modal .diffrow .k { color: var(--ink); min-width: 130px; }
  .modal .diffrow .v { color: var(--muted); font-size: 11.5px; }
  .modal .diffrow .tag { font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; }
  .modal .diffrow .tag.add { color: #5e7355; background: #eaf0e6; }
  .modal .diffrow .tag.remove { color: #9c5b4f; background: #f3e7e3; }
  .modal .diffrow .tag.update { color: #6a5e3a; background: #efe9d8; }
  .modal .empty { font: 11.5px var(--mono); color: var(--faint); padding: 10px 0; }
  .modal .note-strong { color: #6a5e3a; font: 11.5px var(--mono); margin-top: 8px; }

  /* ---------- kanban ---------- */
  .kan-new { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .kan-new input, .kan-new select { font: 12.5px var(--mono); padding: 7px 9px; border: 1px solid var(--hair-strong); border-radius: 7px; background: #fff; color: var(--ink); }
  .kan-new input.t { flex: 1; min-width: 220px; }
  .kan-cols { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .kan-col { flex: 1; min-width: 200px; }
  .kan-col > h4 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .ktask { border: 1px solid var(--hair); border-radius: 9px; background: #fff; padding: 9px 11px; margin-bottom: 8px; }
  .ktask .kt { font-size: 13px; color: var(--ink); line-height: 1.4; }
  .ktask .km { font: 11px var(--mono); color: var(--faint); margin-top: 5px; display: flex; align-items: center; gap: 8px; }
  .ktask .ka { margin-left: auto; color: var(--muted); cursor: pointer; }
  .ktask .ka:hover { color: #9c5b4f; }
  .kan-ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
  .kan-ctl .dstat { font: 11px var(--mono); color: var(--muted); letter-spacing: .03em; }
  .kan-ctl .dstat.on { color: #5e7355; }
  .kan-ctl .btn { padding: 6px 12px; }
  .kan-ctl .out { color: var(--faint); font: 11px var(--mono); }

  /* per-agent 技能管理器 */
  .askrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--hair); font: 12px var(--mono); }
  .askrow .an { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .askadd { display: flex; gap: 8px; margin-bottom: 8px; }
  .askadd input { flex: 1; font: 12px var(--mono); padding: 6px 9px; border: 1px solid var(--hair-strong); border-radius: 7px; background: #fff; color: var(--ink); }
  .askadd .btn { padding: 6px 12px; flex: none; }
  .askrow .sb { font-size: 10px; color: var(--faint); letter-spacing: .03em; flex: none; }
  .askrow .aun { margin-left: auto; color: var(--muted); cursor: pointer; font-size: 11px; flex: none; }
  .askrow .aun:hover { color: #9c5b4f; }
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand">Hermes<small>agent profiles</small><span class="src" id="src">…</span></div>
    </div>
    <div class="side-actions">
      <div class="sa-btn new" id="new-agent" title="新建空 agent（草稿，拖到位置才正式入树）"><span class="ic">＋</span>新建 agent</div>
      <div class="sa-btn" id="dash-open"><span class="ic">▦</span>仪表盘</div>
      <div class="sa-btn" id="kan-open"><span class="ic">▤</span>任务板</div>
      <div class="sa-btn" id="net-open"><span class="ic">⌗</span>关系网</div>
      <div class="sa-btn" id="vault-open"><span class="ic">▥</span>知识库</div>
      <div class="sa-btn" id="const-open"><span class="ic">⚖</span>宪法</div>
    </div>
    <!-- E2: 侧栏顶部搜索框，按名字 / 模型实时过滤主树 -->
    <div class="side-search"><input type="search" id="nav-filter" placeholder="搜 agent…（/ 聚焦）" autocomplete="off" spellcheck="false"></div>
    <nav class="nav" id="nav"><div class="note" style="padding:10px 8px">加载中…</div></nav>
  </aside>

  <main class="main" id="main">
    <div class="welcome">
      <div class="k">你的 AI 团队</div>
      <p>点左边任意一个 AI 开始对话。<br />每个 AI 都有自己的人格、技能和记忆，可以多轮聊、用工具。</p>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="info" id="info" aria-hidden="true"></aside>
<aside class="netwrap" id="netwrap" aria-hidden="true"></aside>
<aside class="netwrap" id="kanwrap" aria-hidden="true"></aside>
<aside class="netwrap" id="constwrap" aria-hidden="true"></aside>
<aside class="netwrap" id="dashwrap" aria-hidden="true"></aside>
<aside class="netwrap" id="vaultwrap" aria-hidden="true"></aside>
<div class="modal-scrim" id="modal-scrim"></div>
<div class="toast-stack" id="toast-stack"></div>
<div class="ctx-menu" id="ctx-menu"></div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/xterm-addon-fit.js"></script>
<script src="/static/vendor/xterm-addon-webgl.js"></script>
<script>
const ROLE = { source: "源", shared: "继承", none: "" };
const ROLE_FULL = { source: "技能源", shared: "借用技能", none: "独立" };  // 仅关系网/详情等高阶视图用
// 显示名映射：profile ID（小写，hermes 硬约束）→ 显示名（首字母大写 / default→X，来自后端 labels.json）。
// dname 优先查 LABELS，没有则回退原 id。全站渲染都走 dname。
const LABELS = {};
const dname = (n) => LABELS[n] || (n || "");
let PROFILES = [];
let current = null;                 // 当前 profile
const TERMS = {};                   // convKey -> { wrap, term, fit, ws }（常驻终端，按对话框）
const TABS = {};                    // profile -> { list:[tab], active: convKey|null }
// E3: 侧栏树折叠状态持久化到 localStorage，刷新页面不丢
const COLLAPSED = new Set(JSON.parse(localStorage.getItem("hermes-collapsed") || "[]"));
function saveCollapsed() {
  try { localStorage.setItem("hermes-collapsed", JSON.stringify([...COLLAPSED])); } catch (e) {}
}
// tab = { key(稳定), sid(绑定后填), title, preSids:[] }
let _uid = 0;
const nextKey = (p) => `${p}::c${++_uid}`;

const esc = s => (s || "").replace(/[&<>"']/g, m =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

// 显示名 → 底层 ID 候选：小写、非 ASCII 去掉、非字母数字转连字符、去首尾连字符、限长。
// 纯中文名 slug 为空 → 让用户手填 ID。
function slugify(s) {
  return (s || "").toLowerCase().trim()
    .replace(/[^\x00-\x7f]/g, "")      // 去非 ASCII（中文消失）
    .replace(/[^a-z0-9]+/g, "-")       // 非字母数字 → 连字符
    .replace(/^-+|-+$/g, "")           // 去首尾连字符
    .slice(0, 32).replace(/-+$/g, "");
}

async function getJSON(url) {
  const r = await fetch(url);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
  return j;
}

/* ---------- sidebar ---------- */
function rowHTML(p, toggle) {
  const dead = p.effective_killed;
  // 侧栏只显示对用户有意义的徽章：停用 / 化身。技能图角色（源/继承/独立）对小白无意义，不显示。
  const badge = dead
    ? `<span class="role" style="color:#9c5b4f">${p.killed ? "已停用" : "随上级停用"}</span>`
    : (p.main_twin ? `<span class="role" style="color:#5e7355">化身</span>` : "");
  // draggable：侧栏树直接拖动改上级（drop 到另一节点 → reparentDialog）。主 AI 是最高层，不可拖。
  const draggable = p.name === "default" ? "" : 'draggable="true"';
  const titleAttr = dead ? "已停用" : (p.name === "default" ? "主 AI（最高层，不能移动）" : "拖到另一个 AI 上 = 改它的上级");
  return `<div class="it ${current === p.name ? "on" : ""} ${dead ? "dead" : ""}" data-name="${esc(p.name)}" role="button" tabindex="0" ${draggable} title="${titleAttr}">
    ${toggle}<span class="nm" title="${esc(p.name)}">${esc(dname(p.name))}</span>
    ${badge}
    <span class="gw ${p.gateway === "running" ? "run" : ""}" title="gateway ${p.gateway || "?"}"></span>
    <span class="mbtn" data-menu="${esc(p.name)}" title="更多">⋯</span>
  </div>`;
}
function renderNav() {
  // 草稿（顶栏「+ 新建」生成、尚未拖到位置）从主树拆出，单独在底部以虚框展示——
  // 提醒用户它们处于"游离"态，去关系网面板拖到位置才正式入树。
  const drafts = PROFILES.filter(p => p.is_draft);
  const main = PROFILES.filter(p => !p.is_draft);

  // 用每个 profile 的 .parent 在前端拼出父子森林
  const byName = {}; main.forEach(p => byName[p.name] = p);
  const kids = {};
  main.forEach(p => { if (p.parent && byName[p.parent] && p.parent !== p.name) (kids[p.parent] = kids[p.parent] || []).push(p.name); });
  // 分身（main_twin）= 主 agent 的另一种模态，同灵魂 → 在同级里置顶成组，再按字母排其余
  const twinFirst = (x, y) => {
    const tx = byName[x].main_twin ? 0 : 1, ty = byName[y].main_twin ? 0 : 1;
    return (tx - ty) || x.localeCompare(y);
  };
  Object.values(kids).forEach(a => a.sort(twinFirst));
  const hasKids = n => (kids[n] || []).length > 0;
  // 根 = 无父级的（正常只有主 agent default；显式置顶的也算根）。default 永远排最前。
  const roots = main.filter(p => !p.parent || !byName[p.parent]).map(p => p.name)
    .sort((a, b) => (a === "default" ? -1 : b === "default" ? 1 : a.localeCompare(b)));

  const nodeHTML = (name) => {
    const p = byName[name]; if (!p) return "";
    const has = hasKids(name);
    const col = COLLAPSED.has(name);
    const toggle = has
      ? `<span class="tw" data-toggle="${esc(name)}">${col ? "▸" : "▾"}</span>`
      : `<span class="tw empty"></span>`;
    const sub = (has && !col) ? `<div class="subtree">${kids[name].map(nodeHTML).join("")}</div>` : "";
    return `<div class="snode">${rowHTML(p, toggle)}${sub}</div>`;
  };

  const nav = document.getElementById("nav");
  // 置顶区：pin 的 agent 做成快捷"分身"放最上，点了跳真 profile，原树位置不动
  const pins = PROFILES.filter(p => p.is_pinned && !p.is_draft);
  const pinnedHTML = pins.length
    ? `<div class="pinned-wrap">${pins.map(p => `
        <div class="pin-row ${current === p.name ? "on" : ""}" data-pin-go="${esc(p.name)}" title="置顶快捷方式 → ${esc(p.name)}">
          <span class="pic">📌</span><span class="pn">${esc(dname(p.name))}</span>
          <span class="unpin" data-unpin="${esc(p.name)}" title="取消置顶">✕</span>
        </div>`).join("")}</div>`
    : "";
  const mainHTML = roots.length
    ? roots.map(nodeHTML).join("")
    : '<div class="note" style="padding:10px 8px">无 Profile</div>';
  // A2：侧栏不再列出每个草稿（关系网面板已有可拖动入口），改成单行提示，避免双展示
  const draftsHTML = drafts.length
    ? `<div class="drafts-wrap"><div class="drafts-summary" id="draft-summary">
         ${drafts.length} 个草稿 <span class="hint">点击 → 关系网处理</span>
       </div></div>`
    : "";
  nav.innerHTML = pinnedHTML + mainHTML + draftsHTML;
  const ds = document.getElementById("draft-summary");
  if (ds) ds.onclick = openNetwork;
  // 置顶快捷方式：点行体 → 选中真 profile；点 ✕ → 取消置顶
  nav.querySelectorAll("[data-pin-go]").forEach(el => el.addEventListener("click", e => {
    if (e.target.dataset.unpin) return;  // ✕ 自己处理
    selectProfile(el.dataset.pinGo);
  }));
  nav.querySelectorAll("[data-unpin]").forEach(el => el.addEventListener("click", async e => {
    e.stopPropagation();
    await setPin(el.dataset.unpin, false);
  }));
  // ⋯ 菜单
  nav.querySelectorAll("[data-menu]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    const r = el.getBoundingClientRect();
    openCtxMenu(el.dataset.menu, r.right, r.bottom);
  }));
  // E2: 搜索框激活时，重渲染后立即重过滤
  applyNavFilter();
  // 折叠箭头（节点）；点箭头只折叠，stopPropagation 不触发选中
  nav.querySelectorAll("[data-toggle]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    const n = el.dataset.toggle;
    COLLAPSED.has(n) ? COLLAPSED.delete(n) : COLLAPSED.add(n);
    saveCollapsed();
    renderNav();
  }));
  // 侧栏树直接拖拽改父级（与关系网面板共用 reparentDialog）。drop 到 default 即"挂到主 agent 下"
  nav.querySelectorAll(".it[draggable]").forEach(el => {
    el.addEventListener("dragstart", e => { dragNode = el.dataset.name; el.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => { el.classList.remove("drag"); nav.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); });
  });
  nav.querySelectorAll(".it").forEach(el => {
    el.addEventListener("dragover", e => { if (dragNode && dragNode !== el.dataset.name) { e.preventDefault(); el.classList.add("drop"); } });
    el.addEventListener("dragleave", () => el.classList.remove("drop"));
    el.addEventListener("drop", async e => {
      e.preventDefault(); el.classList.remove("drop");
      const t = el.dataset.name;
      if (dragNode && dragNode !== t) { if (!TREE) await loadTree(); reparentDialog(dragNode, t); }
    });
  });
  // 选中 profile（点行体）
  nav.querySelectorAll(".it").forEach(el => {
    const go = () => selectProfile(el.dataset.name);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

/* E2: 侧栏按名字过滤——空查询时取消高亮，否则把不匹配的 .snode 隐藏，匹配的 .it 加高亮 */
function applyNavFilter() {
  const inp = document.getElementById("nav-filter");
  const nav = document.getElementById("nav");
  if (!inp || !nav) return;
  const q = inp.value.trim().toLowerCase();
  if (!q) {
    nav.classList.remove("filtered");
    nav.querySelectorAll(".snode.fhide, .it.fmatch").forEach(el => {
      el.classList.remove("fhide"); el.classList.remove("fmatch");
    });
    return;
  }
  nav.classList.add("filtered");
  // 先全标隐藏，再把匹配的及其祖先恢复
  nav.querySelectorAll(".snode").forEach(el => el.classList.add("fhide"));
  nav.querySelectorAll(".it").forEach(it => {
    const name = (it.dataset.name || "").toLowerCase();
    if (name.includes(q)) {
      it.classList.add("fmatch");
      // 向上恢复所有祖先 snode
      let p = it.closest(".snode");
      while (p) { p.classList.remove("fhide"); p = p.parentElement.closest(".snode"); }
    } else {
      it.classList.remove("fmatch");
    }
  });
}

/* 侧栏 ⋯ 菜单：Pin / 改名 / Fork / 删除（仿 Claude desktop） */
function openCtxMenu(name, x, y) {
  const p = PROFILES.find(z => z.name === name) || {};
  const pinned = !!p.is_pinned;
  const m = document.getElementById("ctx-menu");
  m.innerHTML = `
    <div class="mi" data-act="pin"><span class="ic">📌</span>${pinned ? "取消置顶" : "置顶"}</div>
    <div class="mi" data-act="rename"><span class="ic">✎</span>改名（显示名）</div>
    <div class="mi" data-act="fork"><span class="ic">⎘</span>Fork（克隆）</div>
    <div class="mi danger" data-act="delete"><span class="ic">🗑</span>删除</div>`;
  m.style.left = Math.min(x, window.innerWidth - 150) + "px";

  m.querySelectorAll(".mi").forEach(el => el.onclick = () => {

/* ---------- conversations（每个 profile 多个对话框=会话；标签页式 增/开/删 + 个性化技能） ---------- */
async function selectProfile(name) {
  current = name;
  renderNav();
  ensureScaffold();
  if (!TABS[name]) TABS[name] = { list: [], active: null };
  Object.values(TERMS).forEach(s => { if (s.wrap) s.wrap.style.display = "none"; });
  await syncSessions(name);
  renderTabs(name);
  const t = TABS[name];
  if (t.active && t.list.some(x => x.key === t.active)) openConv(name, t.active);
  else if (t.list.length) openConv(name, t.list[0].key);
  else showEmpty(name);
}
function ensureScaffold() {
  if (document.getElementById("term-host")) return;
  document.getElementById("main").innerHTML =
    `<div class="top" id="top"></div><div class="tabbar" id="tabbar"></div><div class="term-host" id="term-host"></div>`;
}
function renderTop() {
  const p = PROFILES.find(x => x.name === current) || { name: current, role: "none" };
  document.getElementById("top").innerHTML = `
    <span class="nm">${esc(dname(p.name))}</span>
    <span class="meta">${esc(p.model || "—")}${p.parent ? " · 上级 " + esc(dname(p.parent)) : ""}</span>
    <span class="sp"></span>
    <span class="lnk" id="info-btn">详情</span>
    <span class="lnk" id="top-reload" title="重新载入数据" style="margin-left:14px">↻</span>`;
  document.getElementById("info-btn").onclick = () => openInfo(current);
  document.getElementById("top-reload").onclick = () => { load(); if (current) openInfo(current); };
}
function currentSids(name) { return ((TABS[name] && TABS[name].list) || []).map(x => x.sid).filter(Boolean); }

function renderTabs(name) {
  const t = TABS[name], bar = document.getElementById("tabbar");
  if (!bar) return;
  bar.innerHTML = t.list.map(tab => `
    <div class="tab ${tab.key === t.active ? "on" : ""}" data-key="${tab.key}"
         title="${esc(tab.title)}">
      <span class="tt">${esc(tab.title || "新对话")}</span>
      <span class="cl" data-close="${tab.key}" title="删除对话">×</span>
    </div>`).join("") +
    `<div class="tab-add" id="tab-add" title="新对话">＋</div>` +
    `<span class="tab-sync" id="tab-sync" title="刷新会话列表">⟳</span>`;
  bar.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.dataset.close) { e.stopPropagation(); closeConv(name, e.target.dataset.close); }
      else openConv(name, el.dataset.key);
    });
  });
  document.getElementById("tab-add").onclick = () => newConv(name);
  document.getElementById("tab-sync").onclick = async () => { await syncSessions(name); renderTabs(name); };
}

function cleanTitle(srv) {
  const ok = v => v && v !== "—";
  if (ok(srv.title)) return srv.title;
  if (ok(srv.preview)) return srv.preview.slice(0, 28);
  return "未命名对话";
}
async function syncSessions(name) {
  let data;
  try { data = await getJSON(`/api/sessions/${encodeURIComponent(name)}`); } catch (e) { return; }
  const t = TABS[name];
  const claimed = new Set(t.list.map(x => x.sid).filter(Boolean));
  for (const srv of data.sessions) {
    const sid = srv.id; if (!sid || claimed.has(sid)) continue;
    // 新出现的 sid → 绑到一个尚未绑定、且创建时没见过它的“新对话”标签；否则补一个标签
    const claimer = t.list.find(x => !x.sid && x.preSids && x.preSids.indexOf(sid) === -1);
    if (claimer) {
      claimer.sid = sid;
      claimer.title = cleanTitle(srv);
    } else {
      t.list.push({ key: nextKey(name), sid, title: cleanTitle(srv), preSids: [] });
    }
    claimed.add(sid);
  }
  for (const tab of t.list) {
    if (!tab.sid) continue;
    const srv = data.sessions.find(s => s.id === tab.sid);
    if (srv) tab.title = cleanTitle(srv);
  }
}

function newConv(name) {
  const tab = { key: nextKey(name), sid: null, title: "新对话", preSids: currentSids(name) };
  TABS[name].list.push(tab);
  TABS[name].active = tab.key;
  renderTabs(name);
  openConv(name, tab.key);
}

function openConv(name, key) {
  const t = TABS[name], tab = t.list.find(x => x.key === key);
  if (!tab) return;
  t.active = key;
  Object.values(TERMS).forEach(s => { if (s.wrap) s.wrap.style.display = "none"; });
  let s = TERMS[key];
  if (!s) { s = createTerm(name, tab); TERMS[key] = s; }
  if (s.wrap) s.wrap.style.display = "block";
  const eh = document.getElementById("empty-hint"); if (eh) eh.style.display = "none";
  renderTabs(name);
  renderTop();
  requestAnimationFrame(() => { try { if (s.fit) { s.fit.fit(); sendResizeFor(s); } if (s.term) s.term.focus(); } catch (e) {} });
}

function emptyHintEl() {
  let h = document.getElementById("empty-hint");
  if (!h) {
    h = document.createElement("div");
    h.id = "empty-hint"; h.className = "term-hint";
    h.innerHTML = `这个 Agent 还没有对话。<br />点上方 <code>＋</code> 新建一个对话框——独立上下文，自动继承它的 core skill。`;
    const host = document.getElementById("term-host");
    if (host) host.appendChild(h);
  }
  return h;
}
function showEmpty(name) {
  // 只隐藏所有终端 + 显示提示，绝不 innerHTML 清空（否则会连带销毁别的 profile 的常驻终端 DOM）
  Object.values(TERMS).forEach(s => { if (s.wrap) s.wrap.style.display = "none"; });
  emptyHintEl().style.display = "flex";
  renderTop();
}

function createTerm(name, tab) {
  const host = document.getElementById("term-host");
  const wrap = document.createElement("div");
  wrap.className = "term-wrap";
  host.appendChild(wrap);
  if (typeof Terminal === "undefined") {
    wrap.innerHTML = `<div class="term-hint">未找到 xterm.js。<br />请把 xterm 资源放到 <code>static/vendor/</code>，见 HANDOFF。</div>`;
    return { wrap, term: null, fit: null, ws: null };
  }
  const el = document.createElement("div");
  el.className = "term";
  wrap.appendChild(el);
  const term = new Terminal({
    fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
    fontSize: 13, lineHeight: 1.4, cursorBlink: true, scrollback: 3000,
    theme: {
      background: "#ffffff", foreground: "#2b2a28", cursor: "#2b2a28",
      cursorAccent: "#ffffff", selectionBackground: "#e4e2dd",
      black: "#2b2a28", red: "#9c5b4f", green: "#5e7355", yellow: "#9a7d3f",
      blue: "#4f6485", magenta: "#7e6080", cyan: "#4f7d7a", white: "#d6d3cc",
      brightBlack: "#8a8782", brightRed: "#b06b5c", brightGreen: "#6f8763",
      brightYellow: "#b3924a", brightBlue: "#5d76a0", brightMagenta: "#93738f",
      brightCyan: "#5d918d", brightWhite: "#2b2a28",
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);
  try { fit.fit(); } catch (e) {}
  if (typeof WebglAddon !== "undefined") {            // WebGL 渲染器：滚动顺滑（默认 DOM 渲染器卡）
    try {
      const webgl = new WebglAddon.WebglAddon();
      webgl.onContextLoss(() => { try { webgl.dispose(); } catch (e) {} });  // 上下文丢失→自动退回 DOM
      term.loadAddon(webgl);
    } catch (e) {}
  }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const q = [tab.sid ? "resume=" + encodeURIComponent(tab.sid) : "new=1"];
  const ws = new WebSocket(`${proto}://${location.host}/ws/chat/${encodeURIComponent(name)}?${q.join("&")}`);
  ws.binaryType = "arraybuffer";
  const td = new TextDecoder();
  const s = { wrap, term, fit, ws };
  ws.onopen = () => sendResizeFor(s);
  ws.onmessage = (e) => term.write(typeof e.data === "string" ? e.data : td.decode(new Uint8Array(e.data)));
  ws.onclose = () => { if (term) term.write("\r\n\x1b[2m[会话已结束 · 切走再回来可重连]\x1b[0m\r\n"); };
  term.onData(d => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: "input", data: d })); });
  term.onResize(() => sendResizeFor(s));
  return s;
}

function destroyTerm(key) {
  const s = TERMS[key];
  if (!s) return;
  try { if (s.ws) s.ws.close(); } catch (e) {}     // WS 关 → 服务端 SIGTERM 收掉这个 hermes
  try { if (s.term) s.term.dispose(); } catch (e) {}
  if (s.wrap) s.wrap.remove();
  delete TERMS[key];
}

async function closeConv(name, key) {
  const t = TABS[name], tab = t.list.find(x => x.key === key);
  if (!tab) return;
  const msg = tab.sid
    ? `删除对话「${tab.title}」？会永久删除它的上下文，不可恢复。`
    : `关闭这个还未保存的新对话？`;
  if (!await confirmAsync(msg)) return;
  if (tab.sid) {
    try {
      const r = await fetch(`/api/session/${encodeURIComponent(name)}/${encodeURIComponent(tab.sid)}`, { method: "DELETE" });
      if (!r.ok) throw new Error("HTTP " + r.status);
    } catch (e) { toast("删除失败：" + e.message, "bad"); return; }
  }
  destroyTerm(key);
  t.list = t.list.filter(x => x.key !== key);
  if (t.active === key) t.active = t.list.length ? t.list[t.list.length - 1].key : null;
  renderTabs(name);
  if (t.active) openConv(name, t.active); else showEmpty(name);
}

function sendResizeFor(s) {
  if (!s || !s.term || !s.ws || s.ws.readyState !== 1) return;
  s.ws.send(JSON.stringify({ type: "resize", cols: s.term.cols, rows: s.term.rows }));
}
/* 每条对话的"技能预载"已移除：hermes 渐进式披露——技能按需 / 模型自动触发，
   勾选预载多余。技能归属是 agent 级（分层架构），见关系网的「配置…」与「共享…」。 */

window.addEventListener("resize", () => {
  const t = TABS[current]; if (!t || !t.active) return;
  const s = TERMS[t.active];
  if (s && s.fit) { try { s.fit.fit(); sendResizeFor(s); } catch (e) {} }
});
window.addEventListener("beforeunload", () => {
  Object.values(TERMS).forEach(s => { try { if (s.ws) s.ws.close(); } catch (e) {} });
});

/* 记忆面板：这个 AI 的 MEMORY.md（私脑）+ USER.md（对你的画像）。可看可改（人在环修正） */
async function renderMemory(name) {

  const twinNote = d.is_twin ? `<div class="sub" style="color:#6a5e3a">⚠ 这是主 AI 的化身，记忆和主 AI（X）共享同一份，改这里=改 X 的记忆。</div>` : "";

/* 运行设置 4 杠杆：模型 / 记忆 / 终端隔离 / 危险命令审批。写自有 config，选"继承"= 回退父辈/默认 */
async function renderLevers(name) {
  const box = document.getElementById("leversblk"); if (!box) return;
  let d;
  try { d = await getJSON(`/api/agent/${encodeURIComponent(name)}/levers`); }
  catch (e) { box.innerHTML = `<div class="note">加载失败：${esc(e.message)}</div>`; return; }
  if (d.is_twin) {
    box.innerHTML = `<div class="note" style="padding:6px 0">这是主 AI 的化身，运行设置和主 AI（X）完全一致、不可单独改。要改请去 X 的运行设置。</div>`;
    return;
  }
  // 模型选项：继承 + 已知模型 + 自定义
  const curModel = d.model && (typeof d.model === "object" ? d.model.default : d.model);
  const modelOpts = [`<option value="__inherit__" ${!d.model_own ? "selected" : ""}>继承（用上级/X 的默认）</option>`]
    .concat((d.known_models || []).map(m => {
      const v = "known:" + m.default;
      const sel = d.model_own && curModel === m.default ? "selected" : "";
      return `<option value="${esc(v)}" ${sel}>${esc(m.default)}${m.provider ? "（" + esc(m.provider) + "）" : ""}</option>`;
    }))
    .concat([`<option value="__custom__">自定义…</option>`]).join("");
  const memVal = !d.memory_own ? "__inherit__" : (d.memory_enabled ? "on" : "off");
  const termVal = !d.terminal_own ? "__inherit__" : d.terminal_backend;
  const apprVal = !d.approvals_own ? "__inherit__" : d.approvals_mode;
  const selStyle = "padding:6px 8px; border:1px solid var(--hair-strong); border-radius:6px; font:12px var(--mono); background:#fff; width:100%";
  const reasoningOpts = ["__inherit__", "none", "minimal", "low", "medium", "high", "xhigh"].map(v => {
    const cur = !d.reasoning_own ? "__inherit__" : d.reasoning_effort;
    const label = v === "__inherit__" ? "继承（默认 medium）" : v;
    return `<option value="${v}" ${cur === v ? "selected" : ""}>${label}</option>`;
  }).join("");
  box.innerHTML = `
    <div class="fld"><div class="lbl">模型</div><div class="val">
      <select id="lv-model" style="${selStyle}">${modelOpts}</select>
      <div id="lv-model-custom" style="display:none; margin-top:6px">
        <input id="lv-m-default" placeholder="模型名，如 anthropic/claude-sonnet-4.6" style="${selStyle}; margin-bottom:4px">
        <input id="lv-m-provider" placeholder="provider，如 anthropic" style="${selStyle}; margin-bottom:4px">
        <input id="lv-m-baseurl" placeholder="base_url（可空）" style="${selStyle}">
      </div>
      <div style="margin-top:6px">
        <span class="rl" id="lv-adv-toggle" style="font-size:11px">高级 ▾</span>
        <div id="lv-adv" style="display:none; margin-top:6px">
          <div style="display:flex; align-items:center; gap:8px">
            <span style="font:11px var(--mono); color:var(--muted); flex:none">推理强度</span>
            <select id="lv-reasoning" style="${selStyle}">${reasoningOpts}</select>
          </div>
          <div class="sub" id="lv-reasoning-hint" style="margin-top:4px"></div>
        </div>
      </div>
    </div></div>
    <div class="fld"><div class="lbl">记忆</div><div class="val">
      <select id="lv-mem" style="${selStyle}">
        <option value="__inherit__" ${memVal === "__inherit__" ? "selected" : ""}>继承</option>
        <option value="on" ${memVal === "on" ? "selected" : ""}>开（长期记忆 + 用户画像）</option>
        <option value="off" ${memVal === "off" ? "selected" : ""}>关（一次性，不记）</option>
      </select></div></div>
    <div class="fld"><div class="lbl">终端隔离</div><div class="val">
      <select id="lv-term" style="${selStyle}">
        <option value="__inherit__" ${termVal === "__inherit__" ? "selected" : ""}>默认（local 直接在本机跑）</option>
        <option value="docker" ${termVal === "docker" ? "selected" : ""}>docker（沙箱隔离，需装 docker）</option>

    const cap = /\bo[1-9]\b|r1|reasoner|thinking|qwq|deepseek-r|claude-(sonnet|opus)-4|claude-4|gpt-5|gemini-[0-9.]+-(flash|pro)-thinking/i.test(mname);
    hint.innerHTML = cap
      ? `<span style="color:#5e7355">✓ 当前模型「${esc(mname || "?")}」看起来支持推理档位</span>`
      : `<span style="color:#9c8b4a">⚠ 当前模型「${esc(mname || "继承的默认")}」可能不吃这个参数，设了也许无效（仅 o系/R1/Claude-4 thinking 等推理模型有效）</span>`;
  };
  mSel.onchange = () => { mCustom.style.display = mSel.value === "__custom__" ? "block" : "none"; reasoningHint(); };

    else if (mv === "__custom__") {
      const def = document.getElementById("lv-m-default").value.trim();
      if (!def) { document.getElementById("lv-msg").textContent = "自定义模型名不能为空"; return; }
      payload.model = { default: def, provider: document.getElementById("lv-m-provider").value.trim() || null,
                        base_url: document.getElementById("lv-m-baseurl").value.trim() || null };
    } else if (mv.startsWith("known:")) {
      const km = (d.known_models || []).find(m => m.default === mv.slice(6));
      if (km) payload.model = km;
    }
    // 记忆 / 终端 / 审批
    const memv = document.getElementById("lv-mem").value;
    payload.memory_enabled = memv === "__inherit__" ? "__inherit__" : (memv === "on");
    payload.terminal_backend = document.getElementById("lv-term").value;
    payload.approvals_mode = document.getElementById("lv-appr").value;
    payload.reasoning_effort = document.getElementById("lv-reasoning").value;
    try {
      const r = await fetch(`/api/agent/${encodeURIComponent(name)}/levers`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail || "HTTP " + r.status);
      toast("运行设置已保存", "ok");

    } catch (e) { document.getElementById("lv-msg").textContent = "保存失败：" + e.message; }
  };
}

function fmtBytes(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB"; }
function renderVaultPanel(data) {
  const body = document.getElementById("vault-body");
  if (!data.exists) {
    body.innerHTML = `<div class="net-hint">知识库路径不存在：<code>${esc(data.root)}</code><br>去 <code>dashboard/vault_config.json</code> 改 <code>root</code> 指向你的库。</div>`;
    return;
  }
  const obs = `obsidian://open?path=${encodeURIComponent(data.root)}`;
  const hint = `<div class="net-hint">这是<b>全局知识库</b>——所有 AI 共享同一个库（检索 / RAG 由 llmwiki 负责，这里只做浏览和读写）。
    <br><code>${esc(data.root)}</code> · ${data.file_count} 篇 · <a class="lnk" href="${obs}">用 Obsidian 打开</a></div>`;
  const tree = renderVaultTree(data.tree || [], 0);
  body.innerHTML = `${hint}<div class="vault-tree">${tree || '<div class="vault-empty">空知识库</div>'}</div>`;
  body.querySelectorAll(".vfile").forEach(el => el.onclick = () => openVaultNote(el.dataset.path));
}
function renderVaultTree(nodes, depth) {
  return nodes.map(n => {
    if (n.type === "dir") {
      const inner = renderVaultTree(n.children || [], depth + 1);
      const open = depth === 0 ? " open" : "";
      return `<details class="vdir"${open}><summary><span class="vdir-name">${esc(n.name)}</span><span class="vdir-c">${(n.children || []).length}</span></summary><div class="vdir-body">${inner || '<div class="vault-empty">空</div>'}</div></details>`;
    }
    return `<div class="vfile" data-path="${esc(n.path)}"><span class="vf-name">${esc(n.title)}</span><span class="vf-meta">${fmtBytes(n.size)}</span></div>`;
  }).join("");
}

/* 极简 markdown → HTML 渲染（够用：标题、强调、代码块、行内代码、链接、列表、引用、[[wikilinks]]） */
function renderMarkdown(src) {
  if (!src) return "";
  // 1. 先 escape，再用占位符护住 fenced code（剥掉语言标识行，例 ```python）
  const fences = [];
  let t = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    fences.push(code.replace(/\n$/, "")); return `__FENCE_${fences.length - 1}__`;
  });
  t = esc(t);
  // 2. headers
  t = t.replace(/^### (.+)$/gm, "<h3>$1</h3>")
       .replace(/^## (.+)$/gm, "<h2>$1</h2>")
       .replace(/^# (.+)$/gm, "<h1>$1</h1>");
  // 3. blockquote
  t = t.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
  // 4. lists（简单：连续 `- ` 行包成 ul；连续数字行包成 ol）
  t = t.replace(/(^- .+\n?)+/gm, m => "<ul>" + m.trim().split(/\n/).map(l => `<li>${l.replace(/^- /, "")}</li>`).join("") + "</ul>");
  t = t.replace(/(^\d+\. .+\n?)+/gm, m => "<ol>" + m.trim().split(/\n/).map(l => `<li>${l.replace(/^\d+\. /, "")}</li>`).join("") + "</ol>");
  // 5. inline: code, bold, italic
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(?<![*\w])\*([^*\n]+)\*(?!\w)/g, "<em>$1</em>");
  // 6. links + wikilinks（防 XSS：拒绝 javascript:/data: 协议；href 已 escape）
  t = t.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">$1</span>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
    const safe = /^(https?:|mailto:|\/|#)/i.test(url.trim()) ? url : "#";
    return `<a href="${safe}" target="_blank" rel="noopener">${text}</a>`;
  });
  // 7. fences 还原
  t = t.replace(/__FENCE_(\d+)__/g, (_, i) => `<pre><code>${esc(fences[parseInt(i, 10)])}</code></pre>`);
  // 8. 段落（双换行 → <p>）
  t = t.split(/\n{2,}/).map(p => {
    if (/^<(h\d|ul|ol|pre|blockquote)/.test(p.trim())) return p;
    return p.trim() ? `<p>${p.replace(/\n/g, "<br>")}</p>` : "";
  }).join("\n");
  return t;
}

/* 这个 agent 自己的技能集（成员制）：自有/继承 分类 + 装(install)/卸(uninstall)/解除(继承) */
async function renderAgentSkills(name) {
  const box = document.getElementById("askills");
  if (!box) return;
  let data;
  try { data = await getJSON("/api/agent-skills/" + encodeURIComponent(name)); }
  catch (e) { box.innerHTML = `<div class="note">加载失败：${esc(e.message)}</div>`; return; }
